<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first single column, sticky top bar with streak, fixed bottom tab bar; each tab is one screen */
:root{
  --bg:#f3f4ef; --card:#ffffff; --card2:#eceee6; --fg:#16181b; --muted:#5d625f; --line:#dde0d6;
  --accent:#4f6f0c; --accent-ink:#ffffff; --accent-soft:#e6eecf; --lime:#b6d65a; --lime-ink:#1b2208;
  --sun:#b07800; --sun-soft:#fbf0d4; --bad:#b3261e; --bad-soft:#fbe8e6;
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1c1f; --card:#25272b; --card2:#2e3035; --fg:#eef0ea; --muted:#9ea39c; --line:#35383d;
  --accent:#bcdc63; --accent-ink:#1b2208; --accent-soft:#363f1f; --lime:#b6d65a; --lime-ink:#1b2208;
  --sun:#f0bd45; --sun-soft:#3a2f12; --bad:#ff8f86; --bad-soft:#3e1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1c1f; --card:#25272b; --card2:#2e3035; --fg:#eef0ea; --muted:#9ea39c; --line:#35383d;
  --accent:#bcdc63; --accent-ink:#1b2208; --accent-soft:#363f1f; --lime:#b6d65a; --lime-ink:#1b2208;
  --sun:#f0bd45; --sun-soft:#3a2f12; --bad:#ff8f86; --bad-soft:#3e1d1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in,.main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--f-mono);font-size:13px;border-radius:999px;padding:4px 10px;background:var(--sun-soft);color:var(--sun);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.xp{background:var(--accent-soft);color:var(--accent)}
.main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:var(--accent)}
button.plain{background:var(--card);color:var(--fg);border-color:var(--line);font-weight:400;text-align:left}
button.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],select,textarea{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
a{color:var(--accent)}
a.say{text-decoration:none;display:inline-flex;align-items:center}
.say{border:0;background:var(--accent-soft);color:var(--accent);min-height:32px;padding:4px 10px;font-size:13px;border-radius:999px}
dialog.daily{border:0;border-radius:18px;padding:16px;max-width:min(520px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 32px);background:var(--bg,var(--card));color:var(--fg);display:none;flex-direction:column;gap:12px}
dialog.daily[open]{display:flex}dialog.daily::backdrop{background:rgb(0 0 0/.45)}
.daily-x{position:absolute;top:10px;right:10px}.daily-x button{min-height:36px;padding:4px 12px}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.quest .qchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-ink,#fff)}
.quest.done .qchk{background:var(--accent);border-color:var(--accent)}.quest.done b{text-decoration:line-through;color:var(--muted)}
.quest .qt{min-width:0}.quest .qt b{display:block;font-size:15px}.quest .qt small{color:var(--muted);font-size:12px;font-family:var(--f-mono)}.quest .qgo{min-height:36px;padding:4px 12px;font-size:14px}
.qtoast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;transition:.25s;max-width:calc(100vw - 32px);text-align:center}
.qtoast.show{opacity:1;transform:translate(-50%,0)}
.btnlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-weight:700;text-decoration:none}
.daily .dw{font-family:var(--f-display);font-size:clamp(24px,7vw,32px);overflow-wrap:anywhere}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:6px 0 14px}
.lang-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:64px;padding:10px 12px}
.lang-tile b{font-size:16px;overflow-wrap:anywhere}.lang-tile span{font-size:12px;color:var(--muted);font-weight:400}
.lang-tile[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:84px}
.tile b{font-family:var(--f-display);font-size:17px}
.tile span{font-size:13px;color:var(--muted);font-weight:400}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-btn{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%}
.lesson-btn .n{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.lesson-btn .t{min-width:0}
.lesson-btn .t small{display:block;color:var(--muted);font-size:13px}
.done{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.ex{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.ex p{flex:1;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button.right{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.flash{min-height:220px;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .word{font-family:var(--f-display);font-size:clamp(26px,7vw,36px);font-weight:700;overflow-wrap:anywhere}
.flash .trans{font-size:20px}
.flash .exs{font-style:italic;color:var(--muted);font-size:15px}
.diff span{padding:1px 3px;border-radius:4px}
.diff .ok{background:var(--accent-soft)} .diff .no{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.diff .miss{background:var(--sun-soft);color:var(--sun)}
.dstage{position:relative;margin:4px 0 12px;padding:30px 8px 6px;border-radius:22px;overflow:hidden;background:radial-gradient(90% 120% at 50% 100%,var(--accent-soft),transparent 70%),var(--card2)}
.ds-row{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:178px}
.dt{position:relative;height:100%;transform-origin:50% 100%}
.dt img{height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));transition:filter .4s}
.dt .fx{position:absolute;inset:0;pointer-events:none}
.dt .blush{position:absolute;width:15%;height:6%;margin:-3% 0 0 -7.5%;border-radius:50%;background:radial-gradient(rgba(255,95,115,.6),transparent 70%);animation:dsFade .4s both}
.dt .tear{position:absolute;width:5%;height:5%;margin-left:-2.5%;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#8fd3ff;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;animation:dsTear 1.1s ease-in infinite}
.dt .sweat{position:absolute;width:7%;height:7%;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:linear-gradient(135deg,#d7f0ff,#7cc6e8);box-shadow:0 1px 2px rgba(0,0,0,.2);animation:dsSweat 1.6s ease-in infinite}
.dt .sym{position:absolute;top:-2%;font:700 26px/1 var(--f-display);color:var(--accent);text-shadow:0 2px 0 var(--card);animation:dsPop .5s cubic-bezier(.3,1.6,.5,1) both,dsFloat 2.4s 0.5s ease-in-out infinite}
.dstage[data-r=confused] .sym,.dstage[data-r=surprised] .sym{color:var(--sun);font-size:32px}
.dstage[data-r=laughing] .sym,.dstage[data-r=reassuring] .sym,.dstage[data-r=encouraging] .sym{color:#e0607a}
.dstage[data-r=disappointed] .sym{color:var(--muted)}
.dstage[data-r=disappointed] .dt img{filter:drop-shadow(0 6px 8px rgba(0,0,0,.18)) saturate(.7) brightness(.95)}
.ds-cap{margin:6px 0 0;text-align:center;font:600 15px/1.3 var(--f-display);min-height:20px}
.ds-conf{position:absolute;inset:0;pointer-events:none}
.ds-conf i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;background:var(--c);animation:dsConf 1.8s var(--d) ease-in 2 both}
.mic-btn.on,#spStart.on{background:var(--bad);color:#fff;animation:dsPulse 1.2s ease-in-out infinite}
.dstage[data-r=idle] .dt{animation:dsBreath 4s ease-in-out infinite}.dstage[data-r=idle] .dt-f{animation-delay:-2s}
.dstage[data-r=listening] .dt{animation:dsListen 2.6s ease-in-out infinite}.dstage[data-r=listening] .dt-f{animation-name:dsListenF}
.dstage[data-r=apologetic] .dt{animation:dsBow 2.5s ease-in-out 2}
.dstage[data-r=celebrating] .dt{animation:dsVictory .7s ease-in-out 7}.dstage[data-r=celebrating] .dt-f{animation-delay:.15s}
.dstage[data-r=confused] .dt{animation:dsWobble 1.25s ease-in-out 4}.dstage[data-r=confused] .dt-f{animation-delay:.2s}
.dstage[data-r=disappointed] .dt{animation:dsDip 5s ease-in-out both}
.dstage[data-r=discovery] .dt{animation:dsLean 2.5s ease-in-out 2}.dstage[data-r=discovery] .dt-f{animation-name:dsLeanF}
.dstage[data-r=encouraging] .dt{animation:dsHop .9s ease-in-out 5}.dstage[data-r=encouraging] .dt-f{animation-delay:.2s}
.dstage[data-r=laughing] .dt{animation:dsLaugh .32s ease-in-out 15}.dstage[data-r=laughing] .dt-f{animation-delay:.08s}
.dstage[data-r=proud] .dt{animation:dsLift 5s ease-in-out both}
.dstage[data-r=reassuring] .dt{animation:dsSway 2.5s ease-in-out 2}.dstage[data-r=reassuring] .dt-f{animation-delay:.3s}
.dstage[data-r=surprised] .dt{animation:dsSurprise 1.2s cubic-bezier(.3,1.6,.5,1) both}
.dstage[data-r=teaching] .dt-m{animation:dsPresent 1.25s ease-in-out 4}.dstage[data-r=teaching] .dt-f{animation:dsListenF 2.5s ease-in-out 2}
@keyframes dsBreath{50%{transform:translateY(-2px) scaleY(1.01)}}
@keyframes dsListen{50%{transform:rotate(3deg) translateX(3px)}}@keyframes dsListenF{50%{transform:rotate(-3deg) translateX(-3px)}}
@keyframes dsBow{40%,60%{transform:translateY(6px) rotate(-5deg) scaleY(.95)}}
@keyframes dsVictory{30%{transform:translateY(-20px) scale(1.04)}50%{transform:translateY(0) scale(1.02,.97)}}
@keyframes dsWobble{25%{transform:rotate(-7deg)}75%{transform:rotate(6deg)}}
@keyframes dsDip{15%,85%{transform:translateY(9px) scale(.97)}}
@keyframes dsLean{40%,70%{transform:rotate(5deg) translateX(8px)}}@keyframes dsLeanF{40%,70%{transform:rotate(-5deg) translateX(-8px)}}
@keyframes dsHop{35%{transform:translateY(-9px)}60%{transform:translateY(0) scale(1.02,.98)}}
@keyframes dsLaugh{50%{transform:translateY(-5px) rotate(2.5deg)}}
@keyframes dsLift{15%,85%{transform:translateY(-10px) scale(1.05)}}
@keyframes dsSway{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes dsSurprise{0%{transform:scale(1)}25%{transform:scale(1.13) translateY(-6px)}100%{transform:scale(1)}}
@keyframes dsPresent{40%,60%{transform:translateX(6px) rotate(2deg)}}
@keyframes dsFade{from{opacity:0}}
@keyframes dsPop{from{transform:scale(0) translateY(10px);opacity:0}}
@keyframes dsFloat{50%{translate:0 -5px}}
@keyframes dsTear{from{translate:0 0;opacity:1}to{translate:0 26px;opacity:0}}
@keyframes dsSweat{from{translate:0 0;opacity:0}20%{opacity:1}to{translate:0 18px;opacity:0}}
@keyframes dsConf{from{transform:translateY(0) rotate(0)}to{transform:translateY(240px) rotate(540deg);opacity:.2}}
@keyframes dsPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.dt,.dt *,.ds-conf i{animation:none!important}}
.chat{display:flex;flex-direction:column;gap:10px}
.ls-q{border-left:3px solid var(--accent);padding:8px 12px;background:var(--bg);border-radius:0 8px 8px 0;margin:0}.ls-grp{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}.ls-ok .say{background:var(--accent-soft)}.ls-no .say{background:var(--bad-soft);color:var(--bad)}.ls-piv .say{background:var(--sun-soft);color:var(--sun)}

.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}

.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}

.seg{display:flex;gap:6px;flex-wrap:wrap}

.card{border-radius:20px}
.hello h1{font-size:26px}

.qlist[data-more="true"]:not(.all)>.quest:nth-child(n+3){display:none}.hello p{margin:2px 0 0}

.qtoast{display:flex;align-items:center;gap:8px}.ring{width:100%;height:100%;transform:rotate(-90deg)}

1 = Mittelstufe (Goethe B1) · B2 = obere Mittelstufe (Uni-Zugang)",null,null,"Jede Lektion hat eine kurze Regel, Beispiele zum Anhören und ein Quiz. Mach das Quiz fertig, um die Lektion abzuhaken.",null,null,null,null,null,null,null,"Lektion wird geschrieben… Das dauert beim ersten Mal etwa 20–60 Sekunden.",null,null,null,"Tippe auf die richtige Antwort.","Schreib das fehlende Wort oder den ganzen Satz und tippe dann auf Prüfen.","Tippe auf ein Antwortfeld, dann auf das 🎤 deiner Tastatur, und sag das fehlende Wort oder den ganzen Satz. Das Mikrofon hört nur zu, solange du es benutzt.",null,null,null,null,null,null,null,null,null,"Schreib oder sag zuerst eine Antwort.",null,"{0} von {1} richtig. Lies die Regel noch einmal und versuch es später wieder.",null,null,null,null,"Ein gemischter Test wie der Grammatikteil einer Prüfung. Am Ende siehst du, welche Lektionen du wiederholen solltest.",null,null,null,"Wiederhole diese Lektionen:",null,null,"Öffne zuerst ein paar Lektionen. Der Test mischt Fragen aus den Lektionen, die du schon geöffnet hast.",null,"Karten, die du kannst, kommen später wieder, und Karten, die du nicht kannst, früher. Wähl ein Deck oder übe alles, was fällig ist.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"Erstelle Karten für jede Sprache und jedes Thema, z. B. Spanisch für die Reise oder Englisch für den Beruf.",null,null,null,null,null,null,"Heute ist in diesem Deck keine Karte fällig. Komm morgen wieder oder übe ein anderes Deck.",null,null,null,null,null,null,null,null,null,"Hör dir den Satz an und schreib genau, was du hörst. Du kannst ihn langsamer abspielen.",null,null,null,null,null,"Der komplette B1-Hörtest (4 Teile, 30 Fragen) ist im",null,null,null,"Dieselbe Sprache klingt von Stadt zu Stadt anders. Hör dir jeden Akzent mit einer weiblichen (♀) oder männlichen (♂) Computerstimme an und dann echte Menschen auf YouTube und TikTok. ✓ heißt, dein Gerät hat eine Stimme für diesen Akzent.",null,null,null,null,null,null,null,null,null,"Hör zu und sag dann den Satz. Lugha prüft, welche Wörter dein Handy verstanden hat. Klingt ein Wort falsch, übe diesen Laut noch einmal.",null,null,"Tippe auf das","🎤 Mikrofon deiner Tastatur","und sag den Satz. Dein Mikrofon ist nur an, solange du es antippst oder hältst, und Lugha schaltet es nie selbst ein.","iPhone: 🎤 unten rechts auf der Tastatur (Tastatur auf deine Lernsprache stellen) · Android: 🎤 in Gboard · Windows: Win + H · Mac: zweimal fn drücken",null,null,null,null,null,null,"Für Deutsch nutzt Lugha eine weibliche Stimme wie","oder eine männliche Stimme wie",". Das sind Amazon-Polly-Stimmen, die nicht in einer Webseite laufen, deshalb wählt Lugha die ähnlichste natürliche Stimme auf deinem Gerät.",null,null,null,null,null,null,null,"Dein Gerät hat noch keine Stimme für diesen Akzent. Unten steht, wie du eine hinzufügst.",null,"Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch. Lade Anna, Helena (weiblich) oder Markus, Yannick (männlich) und wähle „Erweitert“ oder „Premium“ für die beste Qualität.","Öffne Lugha in",". Dort gibt es natürliche Stimmen wie Katja, Amala, Conrad, Killian sowie Ingrid und Jonas (Österreich) und Leni und Jan (Schweiz).","Einstellungen → Bedienungshilfen → Sprachausgabe → Google → Sprachdaten installieren → Deutsch.",null,null,"Du bekommst eine echte englische E-Mail. Schreib sie auf Deutsch neu und bekomm eine volle Prüfungsbewertung nach den offiziellen ÖSD/Goethe-B1-Kriterien, oder prüf sie mit der Inhaltsliste oder der Musterlösung. Deine Entwürfe werden auf diesem Gerät gespeichert.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"Deine E-Mail auf Deutsch · ✍️ tippen oder 🎤 ins Feld tippen und mit dem Mikrofon der Tastatur diktieren","Schreib zuerst deine E-Mail.","Schreib diese E-Mail auf Deutsch neu.","Schreib die E-Mail auf Deutsch.",null,null,null,null,"Die offizielle Bewertung braucht diese Seite in Claude, während du angemeldet bist. Die Checkliste und die Musterlösung funktionieren auch ohne.","Die offizielle Bewertung ist für dieses Konto nicht verfügbar.","Die Bewertung kam unvollständig zurück. Bitte tippe noch einmal auf den Button.","Das hat nicht geklappt. Bitte versuch es noch einmal.","Das hat nicht geklappt.","Zu viele Anfragen. Bitte versuch es in ein paar Minuten noch einmal.","Zu viele Anfragen. Bitte versuch es später noch einmal.","Zu viele Anfragen. Bitte warte ein paar Minuten.","Zu viele Nachrichten. Bitte warte ein paar Minuten.","Die Nachricht konnte nicht gesendet werden. Bitte versuch es noch einmal.","Die KI ist für dieses Konto nicht verfügbar.","Die KI braucht diese Seite in Claude, während du angemeldet bist. Die Deutschkurse funktionieren auch ohne.","Die KI braucht diese Seite in Claude, während du angemeldet bist.",null,null,null,null,null,null,null,null,null,null,"Der KI-Tutor funktioniert, wenn diese Seite in Claude geöffnet ist und du angemeldet bist. Lektionen, Karten und Diktat funktionieren auch ohne.","🎤 Lieber sprechen statt tippen? Tippe auf das Mikrofon deiner Tastatur. Es hört nur zu, solange du es benutzt.",null,null,null,null,null,null,"Lerne die Redemittel für „Gemeinsam etwas planen“ und übe dann mit einem Partner. Dein Partner schlägt vor, widerspricht und fragt. Du antwortest schriftlich oder mit dem Tastaturmikrofon und siehst am Ende, was du abgedeckt hast.",null,null,null,"Lerne 3–4 Redemittel aus jeder Gruppe, damit sie automatisch kommen. Tippe auf einen Satz, um ihn zu hören. Mit höflichem Widersprechen ⭐ holst du in Teil 1 die meisten Punkte.","· Vorschläge machen","· Den Partner fragen","· Zustimmen","· Höflich widersprechen ⭐","· Kompromiss finden","· Zeit und Ort","· Abschließen",null,null,null,null,"Antworte zuerst deinem Partner.","In der Prüfung dauert Teil 1 etwa 3 Minuten, also plane mindestens 5–6 Wortwechsel ein.","Denke nach…",null,"Der KI-Partner braucht Claude, während du angemeldet bist. Es wurde zum festen Partner gewechselt.","Der KI-Partner hat nicht geantwortet. Versuch es noch einmal oder schalte ihn aus, um den festen Partner zu nutzen.","Deine Antwort … ✍️ tippen oder 🎤 hier tippen und mit dem Tastaturmikrofon diktieren",null,null,null,null,null,"Diese Wörter sind auch in deinen Karten.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"Der Kalender deines Handys erinnert dich jeden Tag um diese Uhrzeit und öffnet Lugha. Kein Konto nötig.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"Erstelle eigene Wörter oder öffne eine Lektion: Ihre wichtigsten Wörter landen hier als Karten.",null,null,"Die KI plant beim ersten Mal 12 Lektionen für dein Niveau.",null,null,null,null,null,null,null,null,"Noch leer, aber bereit für Wörter, die dir beim Lernen helfen.",null,"Füge Wörter hinzu, die du im Kurs, in einem Lied oder auf der Straße hörst. Sie werden zu Karten in „Meine Wörter“.",null,null,null,null,null,null,"Lektionen {0}–{1}",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"Such oben ein beliebiges Wort oder füge eigene hinzu. Gespeicherte Wörter werden zu Karten.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]}};

const UI_SKIP="script,style,textarea,[data-noi18n],.opts,.ex:not(.qa),.qa>p:first-child,.msg,.chat,.mt-body,.flash .word,.flash .trans,.flash .exs,[lang]:not(html)";
function uiPref(){ try{ return localStorage.getItem("lugha-ui")||"auto"; }catch(e){ return "auto"; } }
function uiDevice(){ const ls=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"en"]; for(const l of ls){ const b=String(l).toLowerCase().split(/[-_]/)[0]; if(I18N.packs[b]) return b; } return String(ls[0]||"en").toLowerCase().split(/[-_]/)[0]||"en"; }
const UI_WANT=(p=>p==="auto"?uiDevice():p)(uiPref());
const UI_NATIVE={sn:"chiShona",zu:"isiZulu",xh:"isiXhosa",nd:"isiNdebele",st:"Sesotho",tn:"Setswana",rw:"Ikinyarwanda",rn:"Ikirundi",ny:"Chichewa",am:"አማርኛ",ti:"ትግርኛ",om:"Afaan Oromoo",so:"Soomaali",ha:"Hausa",yo:"Yorùbá",ig:"Igbo",ln:"Lingála",mg:"Malagasy",af:"Afrikaans",it:"Italiano",nl:"Nederlands",pl:"Polski",ro:"Română",ru:"Русский",uk:"Українська",tr:"Türkçe",fa:"فارسی",ur:"اردو",hi:"हिन्दी",bn:"বাংলা",ta:"தமிழ்",zh:"中文",ja:"日本語",ko:"한국어",vi:"Tiếng Việt",id:"Bahasa Indonesia",ms:"Bahasa Melayu",tl:"Filipino",th:"ไทย"};
function uiNative(c){ return UI_PACK_NAMES[c]||UI_NATIVE[c]||uiNameOf(c,c); }
function uiNameOf(code,inLang){ try{ return new Intl.DisplayNames([inLang||code],{type:"language"}).of(code)||code; }catch(e){ return code; } }
function UI_NAME(){ return uiNameOf(UI_WANT,"en"); }   // English name of the app language, used in AI prompts
let UI_LANG="en", UI_MAP=new Map(), UI_PATS=[];
function uiRe(k){ let i=0; const src=k.replace(/[.*+?^$()|[\]\\]/g,"\\$&").replace(/\{(\d)(\\\*)?\}/g,(_,n,st)=>st?"(.+?)":"(\\d+(?:[/:.,]\\d+)*)"); return new RegExp("^"+src+"$"); }
function uiBuild(arr,fromEn){
  UI_MAP=new Map(); UI_PATS=[];
  const add=(k,v)=>{ if(v==null||v===k) return; if(/\{\d\*?\}/.test(k)) UI_PATS.push([uiRe(k),v,k.length]); else UI_MAP.set(k,v); };
  I18N.keys.forEach((k,i)=>{ const v=arr[i]; add(k,v); if(fromEn){ const en=I18N.packs.en[i]; if(en&&v) add(en.replace(/\{(\d)\}/g,(m,n)=>k.includes("{"+n+"*}")?"{"+n+"*}":m),v); } });
  UI_PATS.sort((a,b)=>b[2]-a[2]);
}
function uiT(s){
  if(s==null) return null; const t=s.trim(); if(!t||t.length>400) return null;
  let v=UI_MAP.get(t);
  if(v==null) for(const [r,tpl] of UI_PATS){ const m=t.match(r); if(m){ v=tpl.replace(/\{(\d)\}/g,(_,i)=>m[+i+1]); break; } }
  if(v==null||v===t) return null;
  return s.match(/^\s*/)[0]+v+s.match(/\s*$/)[0];
}
function uiAttr(el){ for(const a of ["placeholder","aria-label","title"]){ if(el.hasAttribute(a)){ const v=uiT(el.getAttribute(a)); if(v!=null) el.setAttribute(a,v); } } }
function uiText(n){ const p=n.parentElement; if(!p||p.closest(UI_SKIP)) return; const v=uiT(n.nodeValue); if(v!=null) n.nodeValue=v; }
function uiApply(root){
  if(!root) return;
  if(root.nodeType===3){ uiText(root); return; }
  if(root.nodeType!==1) return;
  if(root.parentElement&&root.parentElement.closest(UI_SKIP)) return;
  uiAttr(root); if(root.matches(UI_SKIP)) return; root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>{ if(!(el.parentElement&&el.parentElement.closest(UI_SKIP))) uiAttr(el); });
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while(n=w.nextNode()) uiText(n);
}
function uiStart(){
  const want=UI_WANT; let arr=I18N.packs[want], fromEn=false;
  if(want==="de"&&!arr) arr=I18N.packs.de;
  if(!arr){ try{ const c=JSON.parse(localStorage.getItem("lugha-ui-ai-"+want)||"null"); if(Array.isArray(c)&&c.length===I18N.keys.length){ arr=c; fromEn=true; } }catch(e){} }
  UI_LANG=arr?want:"en"; if(!arr) arr=I18N.packs.en;
  uiBuild(arr,fromEn);
  document.documentElement.lang=UI_LANG; document.documentElement.dir=UI_RTL.includes(UI_LANG)?"rtl":"ltr";
  uiApply(document.body);
  new MutationObserver(ms=>{ for(const m of ms){
    if(m.type==="childList") m.addedNodes.forEach(uiApply);
    else if(m.type==="characterData") uiText(m.target);
    else if(m.type==="attributes"&&!(m.target.parentElement&&m.target.parentElement.closest(UI_SKIP))) uiAttr(m.target);
  } }).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["placeholder","aria-label","title"]});
  const chip=document.getElementById("uiChip"); if(chip) chip.textContent="🌐 "+UI_WANT.toUpperCase();
  if(UI_LANG!==want) uiAI(want);
}
// Languages without a built-in pack: the AI translates the interface once (in Claude) and it is saved on the device.
async function uiAI(code){
  const sample=await getSample(); if(!sample) return;
  const src=I18N.keys.map((k,i)=>(I18N.packs.en[i]||k));
  const name=uiNameOf(code,"en"); const out=new Array(src.length).fill(null); const N=90;
  try{
    await Promise.all(Array.from({length:Math.ceil(src.length/N)},(_,c)=>(async()=>{
      const part=src.slice(c*N,c*N+N);
      const arr=await sample.json(`Translate these user-interface strings of a free language-learning app into ${name} (language code ${code}). Use the everyday words a speaker of ${name} would expect in a phone app. Keep placeholders like {0} and {1}, emojis, arrows, brand names (Lugha, Claude, Goethe, ÖSD, YouTube, TikTok) and German example phrases inside „…“ or "…" unchanged. Reply with only a JSON array of exactly ${part.length} strings in the same order.\n\n${JSON.stringify(part)}`,{modelTier:"quick"});
      if(!Array.isArray(arr)||arr.length!==part.length) throw new Error("bad");
      arr.forEach((v,i)=>{ out[c*N+i]=typeof v==="string"&&v.trim()?v:null; });
    })()));
    try{ localStorage.setItem("lugha-ui-ai-"+code,JSON.stringify(out)); }catch(e){}
    UI_LANG=code; uiBuild(out,true); document.documentElement.lang=code; document.documentElement.dir=UI_RTL.includes(code)?"rtl":"ltr"; uiApply(document.body);
  }catch(e){}
}
function uiOptions(){
  const p=uiPref(), dev=uiDevice();
  const packs=Object.entries(UI_PACK_NAMES).map(([c,n])=>`<option value="${c}" ${p===c?"selected":""}>${n}</option>`).join("");
  const ai=[...new Set([dev,...UI_AI_LANGS])].filter(c=>!UI_PACK_NAMES[c]).map(c=>`<option value="${c}" ${p===c?"selected":""}>${esc(uiNative(c))} (AI)</option>`).join("");
  return `<option value="auto" ${p==="auto"?"selected":""}>Automatisch (Gerät) · ${esc(uiNative(dev))}</option>${packs}${ai}`;
}
function uiSet(code){ try{ localStorage.setItem("lugha-ui",code); }catch(e){} location.reload(); }

const LESSONS = [
 {n:1,t:"Adjektive als Nomen und n-Deklination",r:"An adjective used as a noun gets a capital letter and normal adjective endings: der Alte, dem Kranken. n-Deklination: some masculine nouns (mostly people and animals, often ending in -e, -ent, -ant, -ist) add -n/-en in every case except Nominativ Singular.",ex:["Wir helfen dem Kranken.","Ich sehe den Studenten.","Das ist das Auto des Nachbarn."],q:[{q:"Ich kenne den ___ . (Student)",o:["Student","Studenten","Studente"],a:1},{q:"Ich spreche mit dem ___ . (Kollege)",o:["Kollege","Kollegen","Kolleges"],a:1},{q:"Der ___ ist freundlich. (alt)",o:["Alte","Alten","alte"],a:0}]},
 {n:2,t:"Das Präteritum",r:"Used in books, reports and stories, and in speech for sein, haben, werden and modal verbs. Regular: stem + -te (lernte). Irregular: new stem (ging, kam, sah). Mixed: new stem + -te (brachte, dachte, wusste).",ex:["Er ging nach Hause.","Wir hatten keine Zeit.","Sie wusste die Antwort."],q:[{q:"Ich ___ nach Hause. (gehen)",o:["gehte","ging","gang"],a:1},{q:"Ihr ___ Pizza mit. (bringen)",o:["bringtet","brachtet","bracht"],a:1},{q:"Sie ___ die Antwort. (wissen)",o:["wisste","wusste","weißte"],a:1}]},
 {n:3,t:"Relativsätze mit Präposition",r:"The preposition comes first, then the relative pronoun: für den, mit der, bei dem, über das. The preposition decides the case, and the verb goes to the end.",ex:["Das ist der Kurs, für den ich mich interessiere.","Das ist die Lehrerin, mit der ich spreche.","Das ist die Firma, bei der ich arbeite."],q:[{q:"Das ist der Lehrer, mit ___ ich spreche.",o:["dem","den","der"],a:0},{q:"Das ist das Problem, über ___ wir sprechen.",o:["dem","das","den"],a:1},{q:"Das ist die Firma, bei ___ ich arbeite.",o:["die","der","dem"],a:1}]},
 {n:4,t:"trotzdem und obwohl",r:"trotzdem (nevertheless) stands at position 1 and the verb comes straight after it: Trotzdem ging er zur Arbeit. obwohl starts a Nebensatz, so the verb goes to the end: obwohl er krank war.",ex:["Es regnet. Trotzdem gehen wir spazieren.","Er war krank. Trotzdem kam er zur Arbeit.","Ich gehe spazieren, obwohl es regnet."],q:[{q:"Er war krank. Trotzdem ___ zur Arbeit.",o:["er ging","ging er","er gehen"],a:1},{q:"Ich lerne, ___ ich müde bin.",o:["trotzdem","obwohl","deshalb"],a:1},{q:"Es war spät. ___ arbeiteten wir weiter.",o:["Obwohl","Trotzdem","Weil"],a:1}]},
 {n:5,t:"Zukunft und Futur I",r:"For the future, German often uses the Präsens + a time word (Morgen fahre ich nach Berlin). Futur I = werden (position 2) + infinitive (end): for predictions, guesses, promises and plans.",ex:["Ich werde dir helfen.","In Zukunft werden mehr Menschen online arbeiten.","Er wird jetzt zu Hause sein."],q:[{q:"Wir ___ bald umziehen.",o:["wird","werden","werdet"],a:1},{q:"Ihr ___ pünktlich sein.",o:["werdet","werden","wird"],a:0},{q:"Bald ___ jeder ein Smartphone haben.",o:["wird","werden","wirst"],a:0}]},
 {n:6,t:"Konditionalsätze mit falls",r:"falls = in case / if (it might happen). It works like wenn: the verb goes to the end. If the falls-clause comes first, the main clause starts with the verb: Falls es regnet, bleiben wir zu Hause.",ex:["Falls es regnet, bleiben wir zu Hause.","Ich rufe dich an, falls ich Hilfe brauche.","Bring eine Jacke mit, falls es kalt wird."],q:[{q:"___ du Hunger hast, gibt es Kuchen.",o:["Falls","Weil","Obwohl"],a:0},{q:"Falls Sie Fragen haben, ___ Sie mir bitte.",o:["schreiben","Sie schreiben","schreibt"],a:0},{q:"Ich komme mit, falls ich Zeit ___.",o:["habe","hat","haben"],a:0}]},
 {n:7,t:"Infinitiv mit zu",r:"zu + infinitive at the end of the sentence. Use it after verbs like anfangen, aufhören, versuchen, vergessen, empfehlen, hoffen, planen; after Lust/Zeit/Angst/Probleme haben; and after es ist wichtig / es macht Spaß. Separable verbs: anzurufen, aufzustehen. NO zu after modal verbs (können, müssen …) or after gehen, sehen, hören, lassen, werden. Same subject → zu-infinitive instead of a dass-clause. Kundenberatung: Ich rate Ihnen, … zu kaufen. Vergessen Sie nicht, … zu prüfen.",ex:["Ich hoffe, dich bald zu sehen.","Vergiss nicht, mich anzurufen.","Ich kann Deutsch sprechen. (kein zu!)","Ich empfehle Ihnen, dieses Handy zu kaufen."],q:[{q:"Ich habe keine Lust, ___.",o:["zu kochen","kochen","zu koche"],a:0},{q:"Vergiss nicht, früh ___.",o:["zu aufstehen","aufzustehen","aufstehen"],a:1},{q:"Wir müssen mehr Deutsch ___.",o:["zu sprechen","sprechen","gesprochen"],a:1},{q:"Ich hoffe, dass ich bestehe. = Ich hoffe, …",o:["die Prüfung zu bestehen","die Prüfung bestehen","zu bestehe die Prüfung"],a:0}]},
 {n:8,t:"da, bevor, während",r:"da = because (the reason is already known, often at the start). bevor = before (first the main clause action, then the other). während = while (two things at the same time) or whereas (contrast). All three send the verb to the end.",ex:["Da ich kein Auto habe, fahre ich mit dem Bus.","Putz dir die Zähne, bevor du schlafen gehst.","Während ich koche, telefoniere ich mit meiner Mutter."],q:[{q:"___ ich kein Auto habe, fahre ich mit dem Bus.",o:["Da","Bevor","Während"],a:0},{q:"Wir essen noch etwas, ___ der Film beginnt.",o:["während","bevor","da"],a:1},{q:"Ich mag Tee, ___ mein Bruder Kaffee bevorzugt.",o:["bevor","da","während"],a:2}]},
 {n:9,t:"Komparativ, Superlativ und Präsentation",r:"schnell – schneller – am schnellsten / der schnellste. Short adjectives often add an Umlaut: groß – größer – am größten. Irregular: gut – besser – am besten, viel – mehr – am meisten, gern – lieber – am liebsten. als = than, so … wie = as … as. Präsentation (Sprechen Teil 2): Thema vorstellen → eigene Erfahrung → Situation im Heimatland → Vor- und Nachteile + Meinung → Schluss (Vielen Dank fürs Zuhören!).",ex:["Mein Bruder ist größer als ich.","Das ist das schnellste Auto.","Ich möchte heute über das Thema … sprechen.","Damit komme ich zum Schluss meiner Präsentation."],q:[{q:"Deutsch ist ___ als Englisch. (schwer)",o:["schwerer","schwerste","mehr schwer"],a:0},{q:"Sie lernt am ___. (gern)",o:["gernsten","liebsten","lieber"],a:1},{q:"Das blaue Kleid ist das ___. (schön)",o:["schönste","schöner","schönsten"],a:0},{q:"Wie beendest du eine Präsentation?",o:["Vielen Dank fürs Zuhören.","Ich fange jetzt an.","Erstens …"],a:0}]},
 {n:10,t:"Konjunktiv II: Wünsche und Bedauern",r:"Wishes now: würde + infinitive, or wäre / hätte (Ich wäre gern berühmt). Regret about the past: hätte / wäre + Partizip II. Verbs that take sein in the Perfekt take wäre. Wish sentences start with the verb and use doch / nur / bloß: Hätte ich doch den Schlüssel nicht vergessen! React: Das ist ja wirklich dumm gelaufen. Da kann man wohl nichts machen.",ex:["Wäre ich nur langsamer gefahren!","Hätte ich doch bloß früher getankt!","Wenn ich früher gekommen wäre, hätte ich den Bus erreicht."],q:[{q:"___ ich doch früher aufgestanden!",o:["Hätte","Wäre","Würde"],a:1},{q:"___ ich bloß mehr gelernt!",o:["Hätte","Wäre","Habe"],a:0},{q:"Wenn du angerufen hättest, ___ ich dir geholfen.",o:["hätte","wäre","habe"],a:0},{q:"Trösten: Vielleicht klappt es ja ein anderes ___.",o:["Mal","Zeit","Tag"],a:0}]},
 {n:11,t:"Plusquamperfekt und nachdem",r:"Plusquamperfekt = the past before the past: hatte / war + Partizip II. nachdem + Plusquamperfekt (happened first), main clause in Präteritum or Perfekt (happened after). The verb goes to the end of the nachdem-clause.",ex:["Nachdem ich die Bewerbung abgeschickt hatte, war ich sehr froh.","Reagieren: Das kann ich gut nachempfinden. / Darüber hätte ich mich auch sehr gefreut.","Nachdem ich aufgestanden war, duschte ich.","Wir erholten uns an einem See, nachdem wir drei Tage gewandert waren."],q:[{q:"Nachdem wir ___, gingen wir nach Hause.",o:["bezahlt hatten","bezahlt waren","bezahlen"],a:0},{q:"Nachdem sie ___, rief sie mich an.",o:["angekommen hatte","angekommen war","ankommt"],a:1},{q:"Toll! Das ist mir auch schon ___.",o:["passiert","erlebt","gefreut"],a:0},{q:"Plusquamperfekt bildet man mit …",o:["habe/bin + Partizip","hatte/war + Partizip","würde + Infinitiv"],a:1}]},
 {n:12,t:"Der Genitiv",r:"Shows possession: des/eines + noun + -s/-es (masculine and neuter), der/einer for feminine and plural. Prepositions: wegen, trotz, während, statt, innerhalb, außerhalb.",ex:["das Auto meines Vaters","Wegen des Regens bleiben wir zu Hause.","Während der Prüfung war ich nervös."],q:[{q:"Die Farbe ___ Hauses ist weiß.",o:["des","der","dem"],a:0},{q:"___ des Regens gehen wir spazieren.",o:["Wegen","Trotz","Während"],a:1}]},
 {n:13,t:"Gründe und Folgen",r:"Folge: deshalb, darum, deswegen, daher, aus diesem Grund. They come at position 1 and the verb follows right after. Grund: nämlich (never at the start), weil + verb at the end, wegen + Genitiv.",ex:["Ich bin krank. Deshalb bleibe ich zu Hause.","Ich gehe nach Hause. Ich bin nämlich müde.","Wegen des Termins komme ich später."],q:[{q:"Es regnet. ___ bleiben wir zu Hause.",o:["Weil","Deshalb","Nämlich"],a:1},{q:"Ich komme später. Ich habe ___ einen Termin.",o:["deshalb","nämlich","weil"],a:1}]},
 {n:14,t:"Partizip als Adjektiv",r:"Partizip I (infinitive + d) = happening now: der lachende Junge. Partizip II = already finished: die geschlossene Tür. Then add the normal adjective ending.",ex:["ein faszinierender Film","die geschlossene Tür","Sie lernen mit motivierenden Übungen."],q:[{q:"das ___ Kind (lachen)",o:["lachende","gelachte","lachend"],a:0},{q:"das ___ Auto (kaufen)",o:["kaufende","gekaufte","gekauft"],a:1}]},
 {n:15,t:"sowohl … als auch / nicht nur … sondern auch",r:"sowohl A als auch B = both A and B. nicht nur A, sondern auch B = not only A but also B, where B is more important. Put a comma before sondern.",ex:["Ich spreche sowohl Deutsch als auch Englisch.","Er ist nicht nur Lehrer, sondern auch Autor.","Ich bin sowohl zuverlässig als auch motiviert."],q:[{q:"Ich spreche sowohl Shona ___ Swahili.",o:["als auch","sondern auch","oder"],a:0},{q:"Sie ist nicht nur klug, ___ auch fleißig.",o:["als","sondern","aber"],a:1}]},
 {n:16,t:"brauchen + zu",r:"nicht brauchen + zu = nicht müssen (it is not necessary). nur brauchen + zu = only this is necessary.",ex:["Du brauchst nicht zu kommen.","Ihr braucht nicht zu bezahlen.","Du brauchst nur anzurufen."],q:[{q:"Du brauchst nicht ___ warten.",o:["—","zu","um"],a:1},{q:"„Du brauchst nicht zu kommen.“ =",o:["Du musst kommen.","Du musst nicht kommen.","Du darfst nicht kommen."],a:1}]},
 {n:17,t:"Ausdrücke mit „es“",r:"es as an empty subject: weather (es regnet), time (es ist acht Uhr), feelings (es geht mir gut), es gibt + Akkusativ, es lohnt sich, es ist wichtig, … zu.",ex:["Es regnet.","Es gibt viele Möglichkeiten.","Es lohnt sich, Deutsch zu lernen."],q:[{q:"___ gibt hier viele Geschäfte.",o:["Er","Es","Das"],a:1},{q:"Es ___ mir schwer, früh aufzustehen.",o:["fällt","gibt","geht"],a:0}]},
 {n:18,t:"entweder … oder / weder … noch / zwar … aber",r:"entweder A oder B = one of the two. weder A noch B = neither A nor B, with no extra nicht. zwar A, aber B = A is true, but B. Word formation: -heit/-keit, -ismus, -ler, -ant/-ent.",ex:["Wir fahren entweder mit dem Bus oder mit dem Zug.","Ich habe weder Zeit noch Lust.","Er ist zwar jung, aber sehr erfahren."],q:[{q:"Er trinkt ___ Kaffee noch Tee.",o:["entweder","weder","zwar"],a:1},{q:"freundlich → die ___",o:["Freundheit","Freundlichkeit","Freundlichung"],a:1}]},
 {n:19,t:"je … desto / Modalpartikeln",r:"Je + Komparativ … (verb at the end), desto/umso + Komparativ + verb. Modalpartikeln: denn makes questions friendly, eigentlich asks about background, doch softens requests, ja refers to something both people know.",ex:["Je mehr ich lerne, desto besser spreche ich.","Wie heißt du denn?","Komm doch mit!"],q:[{q:"Je früher du anfängst, ___ besser.",o:["desto","als","so"],a:0},{q:"Setzen Sie sich ___!",o:["denn","doch","eigentlich"],a:1}]},
 {n:20,t:"indem und sodass",r:"indem = how? (the method). sodass = what is the result? Both start a Nebensatz, so the verb goes to the end.",ex:["Ich lerne Deutsch, indem ich jeden Tag übe.","Es schneite stark, sodass die Straßen gesperrt wurden."],q:[{q:"Man bleibt gesund, ___ man Sport macht.",o:["indem","sodass","damit"],a:0},{q:"Ich habe viel gelernt, ___ ich bestanden habe.",o:["indem","sodass","obwohl"],a:1}]},
 {n:21,t:"Lokale Präpositionen / Passiv mit Modalverb",r:"um … herum + Akkusativ, an … entlang + Dativ, innerhalb and außerhalb + Genitiv. Passiv with a modal verb: Modalverb + Partizip II + werden.",ex:["Wir gehen am Fluss entlang.","Das Hotel liegt außerhalb der Stadt.","Hier darf nicht geraucht werden."],q:[{q:"Wir gehen ___ den See herum.",o:["um","an","in"],a:0},{q:"Das Problem kann gelöst ___.",o:["werden","worden","wird"],a:0}]},
 {n:22,t:"Passiv Präteritum und Perfekt",r:"Präteritum: wurde + Partizip II. Perfekt: ist + Partizip II + worden. Präteritum needs wurde, Perfekt needs worden.",ex:["Die Mauer wurde 1961 gebaut.","Das Problem ist gelöst worden."],q:[{q:"Die Firma ___ 1980 gegründet.",o:["wird","wurde","worden"],a:1},{q:"Das Haus ist renoviert ___.",o:["geworden","worden","werden"],a:1}]},
 {n:23,t:"ohne/statt + zu oder dass",r:"Same subject: ohne/statt … zu + infinitive. Different subjects: ohne dass / statt dass + verb at the end.",ex:["Er ging, ohne sich zu verabschieden.","Ich gehe, ohne dass meine Freunde es merken.","Ich lerne, statt fernzusehen."],q:[{q:"Ich nehme den Bus, ___ mit dem Auto zu fahren.",o:["ohne","statt","damit"],a:1},{q:"Er ging, ohne ___ jemand etwas sagte.",o:["zu","dass","um"],a:1}]},
 {n:24,t:"damit, um … zu, als ob",r:"um … zu only works with the same subject. damit works with the same or different subjects. als ob + Konjunktiv II describes an impression that isn't true.",ex:["Ich lerne Deutsch, um in Deutschland zu arbeiten.","Die Eltern sparen, damit ihre Kinder studieren können.","Er tut so, als ob er alles wüsste."],q:[{q:"Wir investieren, ___ die Qualität steigt.",o:["um","damit","indem"],a:1},{q:"Sie spricht, als ob sie Expertin ___.",o:["ist","wäre","war"],a:1}]}

const LANGS=Object.fromEntries(Object.values(LANG_INFO).map(([l,c])=>[l,c]));
const LANG_EN=Object.fromEntries(Object.entries(LANG_INFO).map(([en,[l]])=>[l,en]));
function langText(l){ const en=LANG_EN[l]; return en&&!l.toLowerCase().includes(en.toLowerCase().split(" ")[0])?`${l} — ${en}`:l; }
function langOptions(sel,only){ const all=Object.keys(LANG_INFO); const opt=en=>{const l=LANG_INFO[en][0]; return `<option value="${esc(l)}" ${l===sel?"selected":""}>${esc(langText(l))}</option>`;};
  if(only) return only.map(opt).join("");
  const pop=all.slice(0,POPULAR), rest=all.slice(POPULAR).sort((a,b)=>a.localeCompare(b));
  return `<optgroup label="Beliebt">${pop.map(opt).join("")}</optgroup><optgroup label="Alle ${all.length} Sprachen (A–Z)">${rest.map(opt).join("")}</optgroup>`; }
function countryOptions(){ return `<option value="">Alle Länder</option>`+Object.entries(WORLD).map(([r,cs])=>`<optgroup label="${esc(r)}">${Object.keys(cs).map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup>`).join(""); }
function countryLangs(c){ for(const cs of Object.values(WORLD)) if(cs[c]) return cs[c]; return null; }

/* ---------- storage (per viewer, best effort) ---------- */
const KEY="lugha.v1";
let S = {xp:0,streak:0,last:null,lessons:{},cards:{},decks:{},dict:0,tutorLang:"Deutsch",level:"B1"};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(typeof cloudPush==="function") cloudPush(); }
const today=()=>new Date().toISOString().slice(0,10);
function addXP(n){
  S.xp+=n; { const d=today(); S.hist=S.hist||{}; S.hist[d]=(S.hist[d]||0)+n; const ks=Object.keys(S.hist).sort(); while(ks.length>40) delete S.hist[ks.shift()]; } if(!S.questXP&&typeof quest==="function") setTimeout(()=>quest("xp",n),0); const t=today();
  if(S.last!==t){ const y=new Date(Date.now()-864e5).toISOString().slice(0,10); S.streak = S.last===y ? S.streak+1 : 1; S.last=t; }
  save(); paintStats();
}
function paintStats(){ const cc=document.getElementById("courseChip"); if(cc) cc.textContent=S.course?S.course.lang+" · "+S.course.level+" ▾":"Sprache wählen ▾"; document.getElementById("streak").textContent="🔥 "+S.streak; document.getElementById("xp").textContent=S.xp+" XP"; }

/* ---------- speech ----------
   German default: a female voice like Marlene, or a male voice like Hans (Amazon Polly voices, which can't run in a browser page).
   We pick the closest installed voice by accent (locale) and gender, and prefer natural/enhanced voices. */
const synth=window.speechSynthesis;
const FEM=new Set("marlene vicki hannah sabrina anna helena petra katja amala ingrid leni libby maisie sonia ana aria jenny michelle natasha emily leah neerja asilia ezinne imani denise eloise sylvie charline ariane elvira dalia elena salome raquel francisca luciana joana zuri rehema elsa isabella alice federica zariyah salma mouna laila tingting meijia sinji xiaoxiao xiaoyi hsiaochen hsiaoyu hiugaai hiumaan thando adri mekdes samantha karen moira tessa veena serena kate fiona amelie audrey marie monica mónica paulina sara yuna kyoko catherine female".split(" "));
const MASC=new Set("hans daniel lennart markus yannick martin conrad killian jonas jan ryan thomas christopher eric guy william connor luke prabhat chilemba abeo elimu henri antoine jean gerard fabrice alvaro manuel jorge lorenzo tomas gonzalo duarte antonio rafiki daudi diego luca hamed shakir jamal maged yunjian yunxi yunxia yunyang yunjhe wanlung themba willem ameha alex fred tom oliver arthur aaron gordon rishi juan male".split(" "));
const NOVELTY=/(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|bahh|albert|bad news|good news)/i;
const normLang=l=>(l||"").replace("_","-").toLowerCase();
function vFirst(v){ return v.name.toLowerCase().replace(/^(microsoft|google|apple)\s+/,"").split(/[\s(\-–]+/)[0]; }
function vGender(v){ const n=vFirst(v); if(FEM.has(n)||/female|weiblich/i.test(v.name)) return "f"; if(MASC.has(n)||/\bmale|männlich/i.test(v.name)) return "m"; return "?"; }
function vScore(v){ let s=0; const n=v.name; if(/natural/i.test(n)) s+=4; if(/premium|enhanced|neural/i.test(n)) s+=3; if(/google/i.test(n)) s+=1; if(NOVELTY.test(n)) s-=8; if(v.localService===false) s+=1; return s; }
function voicesFor(locale){ const all=synth?synth.getVoices():[]; const L=normLang(locale), p=L.slice(0,2); return {exact:all.filter(v=>normLang(v.lang)===L), family:all.filter(v=>normLang(v.lang).startsWith(p))}; }
function pickVoice(locale,gender,name){
  const {exact,family}=voicesFor(locale);
  if(name){ const n=family.find(v=>v.name===name); if(n) return n; }
  const pool=exact.length?exact:family; if(!pool.length) return null;
  const rank=v=>vScore(v)+(gender&&vGender(v)===gender?10:0);
  return [...pool].sort((a,b)=>rank(b)-rank(a))[0];
}
function prefFor(code){ const p=normLang(code).slice(0,2); S.voice=S.voice||{}; return S.voice[p]||{locale:code,gender:"f",name:null,rate:0.92}; }
function setPref(code,patch){ const p=normLang(code).slice(0,2); S.voice=S.voice||{}; S.voice[p]=Object.assign({},prefFor(code),patch); save(); }
function speak(text,lang="de-DE",rate,opt={}){ try{ quest("listen"); }catch(e){}
  if(!synth||!text) return null;
  synth.cancel();
  const pref=prefFor(lang);
  const locale=opt.locale||pref.locale||lang, gender=opt.gender||pref.gender, name=(opt.locale||opt.gender)?null:pref.name;
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice(locale,gender,name); if(v){u.voice=v;u.lang=v.lang;} else u.lang=locale;
  u.rate=rate||pref.rate||0.92; synth.speak(u); return v;
}
if(synth){ synth.getVoices(); synth.onvoiceschanged=()=>{ if(document.getElementById("vList")) go(curRoute); }; }

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const view=$("#view");
function h(html){ view.innerHTML=html; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function sayBtn(text,lang="de-DE",label="▶ hören",locale="",gender=""){ return `<button class="say" data-say="${esc(text)}" data-lang="${lang}" data-locale="${locale}" data-gender="${gender}" aria-label="Vorlesen">${label}</button>`; }
view.addEventListener("click",e=>{ const b=e.target.closest("[data-say]"); if(b) speak(b.dataset.say,b.dataset.lang,undefined,{locale:b.dataset.locale||undefined,gender:b.dataset.gender||undefined}); });

/* ---------- SRS ---------- */
const INTERVALS=[0,1,3,7,16,35];
function allCards(){
  const out=[];
  for(const [deck,list] of Object.entries(WORDS)) list.forEach(([w,t,ex])=>out.push({id:"de|"+w,deck,w,t,ex,lang:"de-DE"}));
  for(const [deck,d] of Object.entries(S.decks)) d.items.forEach(it=>out.push({id:deck+"|"+it.term,deck,w:it.term,t:it.translation,ex:it.example||"",lang:d.code}));
  return out;
}
function cardState(id){ return S.cards[id]||{box:0,due:null}; }
function isDue(id){ const c=S.cards[id]; return !c || !c.due || c.due<=today(); }
function grade(id,ok){
  const c=cardState(id); c.box = ok ? Math.min(c.box+1,INTERVALS.length-1) : 0;
  c.due=new Date(Date.now()+INTERVALS[c.box]*864e5).toISOString().slice(0,10);
  S.cards[id]=c; if(!S.today||S.today.d!==today()) S.today={d:today(),n:0}; S.today.n++; if(ok) addXP(5); else save(); quest("cards");
}

/* ---------- AI: Claude inside Claude, Lugha's own server (/api/ai) on the website ---------- */
// Function declarations only (no top-level const), so these are ready before any code calls them.
function webAI(){ return !window.claude&&/^https?:/.test(location.protocol); }
function hasAI(){ return !!window.claude||webAI(); }
async function getSample(){
  if(window.claude) return await window.claude.use("sample").catch(()=>null);
  return webAI()?webSample():null;
}
// Same shape as Claude's sample: sample(input,{signal,onText,modelTier}) -> {text,truncated},
// sample.json(input,opts) -> parsed value, failures reject with {code,message,text?}.
var LUGHA_AI=null;
function webSample(){
  if(LUGHA_AI) return LUGHA_AI;
  const MAX=3; let running=0; const waiting=[];
  const slot=()=>new Promise(r=>{ if(running<MAX){ running++; r(); } else waiting.push(r); });
  const free=()=>{ const next=waiting.shift(); if(next) next(); else running--; };
  const fail=(code,message,text)=>{ const e={code,message}; if(text) e.text=text; return e; };
  async function run(input,opts,json){
    opts=opts||{};
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    const stream=!json&&typeof opts.onText==="function";
    await slot();
    let got="";
    try{
      if(opts.signal&&opts.signal.aborted) throw fail("cancelled","Stopped.");
      let res;
      try{
        res=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({messages,tier:opts.modelTier||"default",json:!!json,stream}),signal:opts.signal});
      }catch(e){ throw (e&&e.name==="AbortError")?fail("cancelled","Stopped."):fail("network","Couldn't reach Lugha's server."); }
      if(!res.ok){
        let j={}; try{ j=await res.json(); }catch(e){}
        throw fail(j.code||(res.status===429?"rate_limited":"server_error"),j.error||("Server error "+res.status));
      }
      if(!stream){ const j=await res.json(); return {text:String(j.text||""),truncated:!!j.truncated}; }
      const reader=res.body.getReader(), dec=new TextDecoder();
      try{
        for(;;){
          const {done,value}=await reader.read(); if(done) break;
          const delta=dec.decode(value,{stream:true}); if(!delta) continue;
          got+=delta; opts.onText({text:got,delta});
        }
      }catch(e){ throw (e&&e.name==="AbortError")?fail("cancelled","Stopped.",got):fail("network","The connection dropped.",got); }
      if(!got.trim()) throw fail("server_error","The AI sent an empty answer.");
      return {text:got,truncated:false};
    }finally{ free(); }
  }
  const sample=(input,opts)=>run(input,opts,false);
  sample.json=async(input,opts)=>{
    const {text}=await run(input,opts,true);
    const t=text.replace(/^\s*```(?:json)?\s*/i,"").replace(/\s*```\s*$/,"").trim();
    try{ return JSON.parse(t); }catch(e){}
    const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));
    if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
    throw fail("bad_json","The AI's answer wasn't valid JSON.");
  };
  LUGHA_AI=sample; return sample;
}
function aiErr(e){ return e&&e.code==="rate_limited" ? "Too many requests. Please try again in a few minutes." : (e&&(e.code==="not_granted"||e.code==="sampling_disabled")) ? "The AI isn't available on this account." : "That didn't work. Please try again."; }

function starsFor(l){ const sc=doneScore(l.n); if(sc==null) return 0; const nq=(l.q&&l.q.length)||4; const f=sc/nq; return f>=.99?3:f>=.6?2:1; }
function levelMap(list){
  const WORLD=6, H=118, OFF=[0,1,1.5,1,0,-1,-1.5,-1];
  const cur=list.findIndex(l=>doneScore(l.n)==null);
  const items=[]; list.forEach((l,i)=>{ if(i%WORLD===0) items.push({type:"world",w:i/WORLD+1,from:l.n,to:list[Math.min(i+WORLD,list.length)-1].n}); items.push({type:"lvl",l,i}); if((i+1)%WORLD===0||i===list.length-1) items.push({type:"chest",w:Math.floor(i/WORLD)+1,done:list.slice(i-(i%WORLD),i+1).every(x=>doneScore(x.n)!=null)}); });
  let y=0, k=0; const pts=[]; const WC=["#b6d65a","#7cc6e8","#f2b84b","#a78bfa","#f08a7e","#5fd0b0"];
  const html=items.map(it=>{
    if(it.type==="world"){ const c=WC[(it.w-1)%WC.length]; y+=64; return `<div class="world" style="--wc:${c}"><span>Welt ${it.w}</span><small>Lektion ${it.from}–${it.to}</small></div>`; }
    const off=OFF[k++%OFF.length]; const top=y; y+=H; pts.push([50+off*17, top+40]);
    const pos=`style="--x:${50+off*17}%"`;
    if(it.type==="chest"){ return `<div class="node-row" ${pos}><button class="node chest ${it.done?"open":"locked"}" ${it.done||list.length?'data-go="weektest"':""} aria-label="Wochentest"><span>${it.done?"🏆":"🎁"}</span></button><span class="node-t">Wochentest</span></div>`; }
    const {l,i}=it; const st=starsFor(l); const done=st>0; const isCur=i===cur; const locked=!done&&cur>=0&&i>cur;
    return `<div class="node-row${isCur?" cur":""}" ${pos}>${isCur?`<span class="node-me">${mascot("node-m")}<b>Start!</b></span>`:""}<button class="node ${done?"done":isCur?"now":locked?"locked":""}" data-lvl="${l.n}" ${locked?`data-lock="${list[cur].n}"`:""} aria-label="Lektion ${l.n}"><span>${done?"✓":locked?"🔒":l.n}</span></button>
      <span class="stars" aria-label="${st}/3">${[1,2,3].map(n=>`<i class="${n<=st?"on":""}">★</i>`).join("")}</span><span class="node-t">${esc(l.t)}</span></div>`;
  }).join("");
  const d=pts.map((p,i)=>i?`Q ${pts[i-1][0]} ${(pts[i-1][1]+p[1])/2} ${p[0]} ${p[1]}`:`M ${p[0]} ${p[1]}`).join(" ");
  return `<div class="map" style="height:${y+20}px"><svg class="map-path" viewBox="0 0 100 ${y+20}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>${html}</div>`;
}

async function dxWiki(q){

  const pick=[...must,...rest].slice(0,5);

function questToast(msg){ let el=document.getElementById("qToast"); if(!el){ el=document.createElement("div"); el.id="qToast"; el.className="qtoast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.innerHTML=`${mascot("toast-m")}<span></span>`; el.lastChild.textContent=msg; el.classList.add("show"); clearTimeout(questToastT); questToastT=setTimeout(()=>el.classList.remove("show"),2600); }
function questTitle(q){ return QUESTS[q.k].t.replace("{0}",q.n); }
function quest(k,by=1){
  if(!S.course) return; const Q=questsToday(); let changed=false;
  for(const q of Q.list){ if(q.k!==k||q.done) continue; q.p=Math.min(q.n,q.p+by); changed=true;
    if(q.p>=q.n){ q.done=true; S.questXP=true; addXP(15); S.questXP=false; { const t=questTitle(q); questToast("🎯 "+((typeof uiT==="function"&&uiT(t))||t)+" · +15 XP"); } } }
  if(changed&&!Q.bonus&&Q.list.every(q=>q.done)){ Q.bonus=true; S.questDays=(S.questDays||0)+1; S.questXP=true; addXP(50); S.questXP=false; setTimeout(()=>{ const t="🏆 5/5 Quests geschafft! +50 XP"; questToast((typeof uiT==="function"&&uiT(t))||t); },2700); }
  if(changed){ save(); const c=document.getElementById("questCard"); if(c) c.outerHTML=questCard(); }
}
function questCard(){
  const Q=questsToday(); const n=Q.list.filter(q=>q.done).length;

   <p class="muted" style="font-size:13px">${Q.bonus?"Alle Quests geschafft. Morgen gibt es 5 neue.":"Schaffe alle 5 für +50 Bonus-XP. Jeden Tag gibt es 5 neue."}</p></section>`;

/* ---------- daily pop-up: word of the day + question of the day ---------- */
function daySeed(){ let h=0; for(const ch of today()+curLang()+curLevel()) h=(h*31+ch.charCodeAt(0))>>>0; return h; }
function dailyWord(){
  const code=curCode(); const cards=allCards().filter(c=>c.lang===code||c.lang.slice(0,2)===code.slice(0,2)); if(!cards.length) return null;
  const fresh=cards.filter(c=>isDue(c.id)); const pool=fresh.length?fresh:cards; return pool[daySeed()%pool.length];
}
function dailyQuestion(){
  const list=(lessonList()||[]).filter(l=>Array.isArray(l.q)&&l.q.length); if(!list.length) return null;
  const opened=list.filter(l=>S.lessons[lk(l.n)]!=null); const pool=opened.length?list.slice(0,Math.min(list.length,opened.length+1)):list.slice(0,2);
  const l=pool[daySeed()%pool.length]; return {l,q:l.q[(daySeed()>>3)%l.q.length]};
}
function icsReminder(time){
  const [hh,mm]=(time||"18:00").split(":"); const d=new Date(); d.setHours(+hh,+mm,0,0); const pad=n=>String(n).padStart(2,"0");
  const loc=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const url=/^https?:/.test(location.href)&&!/claude\.ai|claudeusercontent/.test(location.href)?location.href.split("#")[0]:"https://learnwithlughaa.korevatools.workers.dev/app/";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lugha//Daily//EN","BEGIN:VEVENT","UID:lugha-daily-"+Date.now()+"@lugha","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+loc,"DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:Lugha · 10 min "+curLang(),"DESCRIPTION:Word and question of the day: "+url,"URL:"+url,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Lugha","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}

function deckStats(){ const code=curCode(); const cards=allCards().filter(c=>c.lang===code); const decks=[...new Set(cards.map(c=>c.deck))];
  return decks.map(d=>{ const l=cards.filter(c=>c.deck===d); return {d,total:l.length,known:l.filter(c=>(S.cards[c.id]?.box||0)>=3).length,due:l.filter(c=>S.cards[c.id]&&isDue(c.id)).length}; }); }

function personalTip(due){
  const P=prof(), n=P.name.trim().split(/\s+/)[0]||"", R=REASONS.find(r=>r[0]===P.reason);
  const tips=[];
  if(due===1) tips.push(n?`${n}, eine Karte wartet heute auf dich.`:"Eine Karte wartet heute auf dich."); else if(due>1) tips.push(n?`${n}, ${due} Karten warten heute auf dich.`:`${due} Karten warten heute auf dich.`);
  if(S.streak>=3) tips.push(`${S.streak} Tage in Folge – weiter so!`);
  if(R) tips.push(`Jede Minute bringt dich deinem Ziel näher: ${tr(R[2])}.`);
  if(xpToday()>=P.goal) tips.push("Tagesziel geschafft! Alles, was jetzt kommt, ist Bonus.");
  if(!tips.length) tips.push(n?`Schön, dass du da bist, ${n}! Starte mit einer kurzen Lektion.`:"Schön, dass du da bist! Starte mit einer kurzen Lektion.");
  return tips[new Date().getDate()%tips.length];
}
function weekChart(goal){
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(Date.now()-(6-i)*864e5); const k=d.toISOString().slice(0,10); return {k,xp:(S.hist&&S.hist[k])||0,lab:(()=>{ try{ return d.toLocaleDateString(UI_LANG||"en",{weekday:"narrow"}); }catch(e){ return k.slice(8); } })()}; });
  const max=Math.max(goal,...days.map(d=>d.xp)); const tot=days.reduce((a,d)=>a+d.xp,0); const hit=days.filter(d=>d.xp>=goal).length;
  return `<section class="pcard"><div class="sec-h"><h3>Diese Woche</h3><span class="muted">${tot} XP · ${hit}/7 Ziel erreicht</span></div>
   <div class="week" role="img" aria-label="${tot} XP">${days.map((d,i)=>`<div class="wk${i===6?" now":""}${d.xp>=goal?" hit":""}"><span class="wk-bar"><i style="height:${Math.max(4,d.xp/max*100)}%"></i></span><small>${esc(d.lab)}</small></div>`).join("")}<span class="wk-goal" style="bottom:${22+goal/max*98}px"></span></div></section>`;
}

/* ---------- quiz engine: answer by ticking, writing or speaking ---------- */
const MODES2=[["tick","☑ Ankreuzen"],["write","✍️ Schreiben"],["speak","🎤 Sprechen"]];
const MODE_HINT={tick:"Tap the right answer.",write:"Type the missing word, or the whole sentence, then tap Prüfen.",speak:"Tap an answer box, then the 🎤 on your keyboard and say the missing word or the whole sentence. The microphone only listens while you use it."};
function normA(t){ return String(t).toLowerCase().replace(/[.,!?;:„“"'’¿¡«»()。，！？،؟…–—]/g," ").replace(/_+/g," ").replace(/\s+/g," ").trim(); }
function isRight(q,input){
  const a=q.o[q.a]; const n=normA(input); if(!n) return false;
  const opts=q.o.map(normA);
  if(n===normA(a)) return true;
  if(/_{2,}/.test(q.q)){ const filled=normA(q.q.replace(/_{2,}/,a)); if(n===filled || n.includes(filled) || filled.includes(n)&&n.split(" ").length>2&&n.includes(normA(a))&&!opts.some((o,i)=>i!==q.a&&o&&n.split(" ").includes(o)&&!normA(a).split(" ").includes(o))) return true; }
  return false;
}
function quizHTML(qs,code,showL){
  const mode=S.ansMode||"tick";
  return `<div class="seg" role="group" aria-label="Antwortart">${MODES2.map(([k,v])=>`<button data-amode="${k}" aria-pressed="${k===mode}">${v}</button>`).join("")}</div>
  <p class="muted" id="modeHint" style="font-size:14px">${MODE_HINT[mode]}</p>`+
  qs.map((q,i)=>`<div class="ex qa" data-q="${i}" style="flex-direction:column;align-items:stretch"><p><b>${i+1}.</b> ${esc(q.q)} ${showL?`<span class="label">L${q.n}</span>`:""}</p>
   <div class="opts" data-q="${i}" ${mode==="tick"?"":"hidden"}>${q.o.map((o,j)=>`<button class="plain" data-opt="${j}">${esc(o)}</button>`).join("")}</div>
   <div class="free row" ${mode==="tick"?"hidden":""}><input type="text" class="fin" id="fin${i}" lang="${code.slice(0,2)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort ${i+1}" placeholder="${mode==="speak"?"🎤 Sag die Antwort …":"Antwort schreiben …"}" style="flex:1"><button class="fchk" data-q="${i}">Prüfen</button></div>
   <p class="fb" style="font-size:14px;margin:0"></p></div>`).join("");
}
function bindQuiz(qs,code,onAnswer,onDone){
  let done=0;
  const finish=(i,correct)=>{
    const box=document.querySelector(`.qa[data-q="${i}"]`); if(box.dataset.done) return; box.dataset.done=1; done++;
    const q=qs[i];
    const opts=box.querySelector(".opts"); opts.hidden=false; opts.querySelectorAll("button").forEach((x,j)=>{x.disabled=true; if(j===q.a) x.classList.add("right");});
    box.querySelector(".free").hidden=true;
    box.querySelector(".fb").innerHTML = correct ? `<span style="color:var(--accent)">✓ Richtig</span>` : `<span style="color:var(--bad)">✗ Richtig ist: <b>${esc(q.o[q.a])}</b></span> ${sayBtn(/_{2,}/.test(q.q)?q.q.replace(/_{2,}/,q.o[q.a]):q.o[q.a],code,"▶ hören")}`;
    onAnswer(i,correct); S.acc=S.acc||{r:0,t:0}; S.acc.t++; if(correct) S.acc.r++; quest("quiz"); if(done===qs.length){ onDone(); if(curRoute&&curRoute.startsWith("lesson")) quest("lesson"); if(curRoute==="weektest") quest("week"); }
  };
  document.querySelectorAll("[data-amode]").forEach(b=>b.onclick=()=>{
    S.ansMode=b.dataset.amode; save();
    document.querySelectorAll("[data-amode]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#modeHint").textContent=MODE_HINT[S.ansMode];
    document.querySelectorAll(".qa").forEach(box=>{ if(box.dataset.done) return; box.querySelector(".opts").hidden=S.ansMode!=="tick"; box.querySelector(".free").hidden=S.ansMode==="tick"; const f=box.querySelector(".fin"); f.placeholder=S.ansMode==="speak"?"🎤 Sag die Antwort …":"Antwort schreiben …"; });
  });
  document.querySelectorAll(".qa .opts").forEach(box=>box.addEventListener("click",e=>{
    const b=e.target.closest("[data-opt]"); if(!b) return; const i=+box.dataset.q; if(box.parentNode.dataset.done) return;
    const right=+b.dataset.opt===qs[i].a; if(!right) b.classList.add("wrong"); finish(i,right);
  }));
  document.querySelectorAll(".qa .fchk").forEach(b=>b.onclick=()=>{ const i=+b.dataset.q; const v=$("#fin"+i).value; if(!v.trim()){ b.closest(".qa").querySelector(".fb").textContent="Write or say an answer first."; return; } finish(i,isRight(qs[i],v)); });
  document.querySelectorAll(".qa .fin").forEach(f=>f.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); f.parentNode.querySelector(".fchk").click(); } }));
}

async function lesson(n){
  const list=lessonList(); const l=list.find(x=>x.n==n); if(!l) return learn();
  if(!l.r){
    h(`<button class="ghost" data-go="learn" style="align-self:flex-start">← Alle Lektionen</button><section class="card"><span class="label">Lektion ${l.n} · ${esc(curLang())} ${curLevel()}</span><h1>${esc(l.t)}</h1><p class="muted" id="lgMsg">Lektion wird geschrieben… This takes about 20–60 seconds the first time.</p></section>`);
    const sample=await getSample();
    if(!sample){ $("#lgMsg").textContent="The AI needs this page to be open in Claude while you're signed in."; return; }
    try{
      const j=await sample.json(`Write lesson ${l.n} "${l.t}" (${l.d}) of a CEFR ${curLevel()} ${curLang()} course for a ${UI_NAME()} speaker. Keep it accurate and at ${curLevel()} level.${ageAI()} Reply with only JSON: {"r": the rule or key idea explained in simple ${UI_NAME()}, max 70 words, "ex": [4 example sentences in ${curLang()}], "tr": [the 4 ${UI_NAME()} translations], "q": [4 multiple-choice questions, each {"q": a ${curLang()} sentence with ___ for the gap or a short question, "o": [3 options], "a": index 0-2 of the correct option}], "v": [6 key words, each {"term": in ${curLang()}, "translation": in ${UI_NAME()}}]}.`,{modelTier:"default"});
      if(!j||!j.r||!Array.isArray(j.ex)||!Array.isArray(j.q)) throw {code:"empty"};
      l.r=String(j.r); l.ex=j.ex.map(String).slice(0,6); l.tr=Array.isArray(j.tr)?j.tr.map(String):[];
      l.q=j.q.filter(q=>q&&q.q&&Array.isArray(q.o)&&q.o.length>=2&&Number.isInteger(+q.a)&&+q.a<q.o.length).map(q=>({q:String(q.q),o:q.o.map(String),a:+q.a})).slice(0,5);
      l.v=Array.isArray(j.v)?j.v.filter(x=>x&&x.term).map(x=>({term:String(x.term),translation:String(x.translation||"")})).slice(0,8):[];
      save();
      if(l.v.length){ const name=`${curLang()} ${curLevel()}: L${l.n}`; S.decks[name]={code:curCode(),items:l.v.map(x=>({term:x.term,translation:x.translation,example:""}))}; save(); }
      if(curRoute==="lesson:"+n) lesson(n);
    }catch(e){ const m=$("#lgMsg"); if(m) m.innerHTML=esc(aiErr(e))+` <button class="ghost" data-go="lesson:${n}">Nochmal</button>`; }
    return;
  }
  let ok=0, answered=0; const code=curCode(); const last=list.length;
  h(`<button class="ghost" data-go="learn" style="align-self:flex-start">← Alle Lektionen</button>
  <section class="card"><span class="label">Lektion ${l.n} · ${esc(curLang())} ${curLevel()}</span><h1>${esc(l.t)}</h1><p>${esc(l.r)}</p></section>
  <section class="card"><h3>Beispiele</h3>${l.ex.map((e,i)=>`<div class="ex"><p>${esc(e)}${l.tr&&l.tr[i]?`<br><span class="muted" style="font-size:14px">${esc(l.tr[i])}</span>`:""}</p>${sayBtn(e,code)}</div>`).join("")}</section>
  ${l.v&&l.v.length?`<section class="card"><h3>Wörter</h3>${l.v.map(v=>`<div class="ex"><p><b>${esc(v.term)}</b> – ${esc(v.translation)}</p>${sayBtn(v.term,code)}</div>`).join("")}<p class="muted" style="font-size:14px">These words are also in your flashcards.</p></section>`:""}
  <section class="card" id="quiz"><h3>Quiz</h3>${quizHTML(l.q,code,false)}<p id="qres" class="muted"></p></section>
  <div class="row">${n>1?`<button class="ghost" data-go="lesson:${n-1}">← Lektion ${n-1}</button>`:""}${n<last?`<button data-go="lesson:${+n+1}">Lektion ${+n+1} →</button>`:""}</div>`);
  bindQuiz(l.q,code,(i,right)=>{ answered++; if(right){ ok++; addXP(10); } },()=>{ S.lessons[lk(l.n)]=ok; save(); $("#qres").textContent = ok===l.q.length ? "Super! Alles richtig. ✓" : `${ok} von ${l.q.length} richtig. Read the rule again and try once more later.`; });
}

    if(!d.items.some(x=>x.term===t)) d.items.push({term:t,translation:tr,example:""}); save(); quest("cards",0); words(); const m=$("#oMsg"); if(m) m.textContent="✓ "+t; };

async function setupGen(){
  const sample = await getSample();
  const sec=$("#gen"); if(!sec) return;
  if(!sample){ sec.hidden=true; return; }
  $("#gBtn").onclick=async()=>{
    const lang=$("#gLang").value, topic=$("#gTopic").value.trim()||"Alltag";
    $("#gBtn").disabled=true; $("#gMsg").textContent="Karten werden erstellt…";
    try{
      const arr=await sample.json(`Create 12 useful vocabulary flashcards for a learner of ${lang} at level ${S.level}, topic: "${topic}".${ageAI()} For nouns include the article if the language has one. Reply with only a JSON array of objects {"term": string in ${lang}, "translation": string in ${UI_NAME()}, "example": short example sentence in ${lang}}.`,{modelTier:"quick"});
      const items=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.term&&x.translation).slice(0,20).map(x=>({term:String(x.term),translation:String(x.translation),example:String(x.example||"")}));
      if(!items.length) throw {code:"empty"};
      const name=`${lang}: ${topic}`; S.decks[name]={code:LANGS[lang]||"de-DE",items}; save();
      startStudy(name);
    }catch(e){
      if(e&&e.code==="not_granted"){ sec.hidden=true; return; }
      $("#gMsg").textContent = e&&e.code==="rate_limited" ? "Too many requests. Please try again in a few minutes." : "That didn't work. Please try again.";
    }finally{ const b=$("#gBtn"); if(b) b.disabled=false; }
  };
}

function startStudy(deck){
  let list=allCards();
  if(deck==="__learn"){ const code=curCode(); const mine=list.filter(c=>c.lang===code); const due=mine.filter(c=>S.cards[c.id]&&isDue(c.id)); list=[...due,...mine.filter(c=>!S.cards[c.id]).slice(0,Math.max(0,10-due.length))]; }
  else if(deck==="__due"){ list=list.filter(c=>S.cards[c.id] && isDue(c.id)); if(!list.length) list=allCards().filter(c=>!S.cards[c.id]).slice(0,10); }
  else list=list.filter(c=>c.deck===deck && isDue(c.id));
  if(!list.length){ h(`<button class="ghost" data-go="words" style="align-self:flex-start">← Decks</button><section class="card"><h2>Alles erledigt ✓</h2><p class="muted">No cards in this deck are due today. Come back tomorrow, or practise another deck.</p></section>`); return; }
  list.sort(()=>Math.random()-.5);
  session={list:list.slice(0,15),i:0,ok:0};
  card();
}
function card(){
  const s=session; const c=s.list[s.i];
  if(!c){ h(`<section class="card"><h2>Fertig! ${s.ok}/${s.list.length} gewusst</h2><p class="muted">The cards you didn't know will come back tomorrow.</p><div class="row"><button data-go="words">Zurück zu den Decks</button></div></section>`); return; }
  h(`<div class="row" style="justify-content:space-between"><button class="ghost" data-go="words">← Decks</button><span class="label">${s.i+1} / ${s.list.length} · ${esc(c.deck)}</span></div>
  <div class="progress"><i style="width:${s.i/s.list.length*100}%"></i></div>
  <section class="card flash" id="flash" role="button" tabindex="0" aria-label="Karte umdrehen">
    <div class="word">${esc(c.w)}</div>
    <div id="back" hidden><div class="trans">${esc(c.t)}</div>${c.ex?`<p class="exs">${esc(c.ex)}</p>`:""}</div>
    <p class="muted" id="hint">Tippen zum Umdrehen</p>
  </section>
  <div class="row" style="justify-content:center">${sayBtn(c.w,c.lang)}${c.ex?sayBtn(c.ex,c.lang).replace("▶ hören","▶ Beispiel"):""}</div>
  <div class="row" id="gradeRow" hidden style="justify-content:center"><button class="bad" id="no">Nochmal</button><button id="yes">Gewusst ✓</button></div>`);
  speak(c.w,c.lang);
  const flip=()=>{ $("#back").hidden=false; $("#hint").hidden=true; $("#gradeRow").hidden=false; };
  $("#flash").onclick=flip; $("#flash").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();} };
  $("#yes").onclick=()=>{ grade(c.id,true); s.ok++; s.i++; card(); };
  $("#no").onclick=()=>{ grade(c.id,false); s.i++; card(); };
}

let dIdx=0;
function listen(){
  const list=curSentences(); const code=curCode();
  if(!list){ h(`${hearSeg("listen")}`+sentenceMaker()); bindSentenceMaker(listen); return; }
  dIdx = S.dict % list.length;
  const sent=list[dIdx];
  h(`${hearSeg("listen")}
  <section class="card"><span class="label">Hören · Diktat ${dIdx+1}/${list.length} · ${esc(curLang())} ${curLevel()}</span><h1>Hören und schreiben</h1><p class="muted">Listen to the sentence and type exactly what you hear. You can slow it down.</p>
   <div class="row"><button id="play">▶ Satz hören</button><button class="ghost" id="slow">🐢 Langsam</button></div>
   <label for="dIn" class="label">Deine Antwort</label><input type="text" id="dIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Schreib den Satz hier …">
   <div class="row"><button id="check">Prüfen</button><button class="ghost" id="skip">Nächster Satz</button></div>
   <div id="dOut"></div></section>
   ${isDE()?`<section class="card"><h3>Prüfungstraining</h3><p class="muted">The full B1 listening test (4 parts, 30 questions) is in <a href="https://claude.ai/artifact/8rqqe4RR8LebU8vfiy9V94" target="_blank" rel="noopener">B1 Hören-Training</a>.</p></section>`:""}`);
  $("#play").onclick=()=>speak(sent,code);
  $("#slow").onclick=()=>speak(sent,code,0.65);
  $("#skip").onclick=()=>{ S.dict++; save(); listen(); };
  $("#check").onclick=()=>{
    const norm=s=>s.toLowerCase().replace(/[.,!?;:„“"¿¡«»。，！？،؟]/g,"").split(/\s+/).filter(Boolean);
    const want=norm(sent), got=norm($("#dIn").value);
    let html="", ok=0;
    want.forEach((w,i)=>{ if(got[i]===w){ html+=`<span class="ok">${esc(w)}</span> `; ok++; } else if(got[i]){ html+=`<span class="no">${esc(got[i])}</span> <span class="miss">${esc(w)}</span> `; } else html+=`<span class="miss">${esc(w)}</span> `; });
    const pct=Math.round(ok/want.length*100);
    $("#dOut").innerHTML=`<p class="diff">${html}</p><p><b>${pct} %</b> richtig · Lösung: ${esc(sent)}</p>`;
    if(pct>=80){ addXP(10); S.dict++; save(); quest("dict"); }
  };
}

   <p><b>Android:</b> Settings → Accessibility → Text-to-speech → Google → install voice data → Deutsch.</p>
  </section>`);
  $("#vlSel").onchange=e=>{ vLang=e.target.value; voiceSetup(); };
  $("#locSel").onchange=e=>{ setPref(firstLoc,{locale:e.target.value,name:null}); voiceSetup(); };

/* Speaking (shadowing). Lugha never opens the microphone itself.
   You tap the 🎤 on your own keyboard only when you want to speak, and your phone writes down what you said. */
let spIdx=0;
function speakPractice(){
  const DL=curSentences(); const code=curCode();
  if(!DL){ h(`${hearSeg("speak")}`+sentenceMaker()); bindSentenceMaker(speakPractice); return; }
  const sent=DL[spIdx%DL.length];
  h(`${hearSeg("speak")}
  <section class="card"><span class="label">Sprechen · Satz ${spIdx%DL.length+1}/${DL.length} · ${esc(curLang())} ${curLevel()}</span><h1>Nachsprechen</h1>${dStage()}
   <p class="muted">Listen, then say the sentence. Lugha checks which words your phone understood. If a word comes out wrong, practise that sound again.</p>
   <div class="ex"><p style="font-size:19px"><b>${esc(sent)}</b></p></div>
   <div class="row"><button id="spPlay">▶ Vorsprechen</button><button class="ghost" id="spSlow">🐢 Langsam</button></div>
   <button id="spStart" class="ghost">🎤 Ich möchte sprechen</button>
   <div id="spBox" hidden>
     <p class="note">Tap the <b>🎤 microphone on your keyboard</b> and say the sentence. Your microphone is only on while you hold or tap it, and Lugha never turns it on by itself.<br><span class="muted" style="font-size:13px">iPhone: 🎤 bottom right of the keyboard (set the keyboard to your learning language) · Android: 🎤 in Gboard · Windows: Win + H · Mac: press fn twice</span></p>
     <label for="spIn" class="label">Das hat dein Handy verstanden</label>
     <textarea id="spIn" lang="${code.slice(0,2)}" autocomplete="off" spellcheck="false" style="min-height:70px" placeholder="Hier erscheint, was du gesagt hast …"></textarea>
     <div class="row"><button id="spCheck">Aussprache prüfen</button><button class="ghost" id="spNext">Nächster Satz</button></div>
     <div id="spOut"></div>
   </div></section>`);
  $("#spPlay").onclick=()=>speak(sent,code);
  $("#spSlow").onclick=()=>speak(sent,code,0.65);
  $("#spNext").onclick=()=>{ spIdx++; speakPractice(); };
  let spMic=null;
  $("#spStart").onclick=()=>{ $("#spBox").hidden=false; if(spMic){ spMic.stop(); return; }
    spMic=micStart(code,{text:t=>{ $("#spIn").value=t; },end:(t,err)=>{ spMic=null; $("#spStart").textContent="🎤 Ich möchte sprechen"; $("#spStart").classList.remove("on");
      if(t) $("#spCheck").click(); else dReact(/not-allowed|service-not-allowed|audio-capture/.test(err)?"apologetic":"confused"); }});
    if(!spMic){ $("#spStart").hidden=true; $("#spIn").focus(); return; }
    $("#spStart").textContent="■ Fertig"; $("#spStart").classList.add("on"); dReact("listening",true); };
  $("#spCheck").onclick=()=>{ quest("speak");
    const norm=s=>s.toLowerCase().replace(/[.,!?;:„“"]/g,"").split(/\s+/).filter(Boolean);
    const want=norm(sent), got=new Set(norm($("#spIn").value));
    if(!got.size){ $("#spOut").innerHTML=`<p class="muted">Nothing arrived yet. Tap the 🎤 on your keyboard and speak.</p>`; dReact("confused"); return; }
    let ok=0; const html=want.map(w=>{ if(got.has(w)){ok++; return `<span class="ok">${esc(w)}</span>`;} return `<span class="miss">${esc(w)}</span>`; }).join(" ");
    const pct=Math.round(ok/want.length*100);
    const weak=want.filter(w=>!got.has(w));
    $("#spOut").innerHTML=`<p class="diff">${html}</p><p><b>${pct} %</b> verstanden${pct>=90?" · Sehr gut! 🎉":""}</p>${weak.length?`<div class="row"><span class="label">Übe diese Wörter</span>${weak.slice(0,6).map(w=>sayBtn(w,code,"▶ "+w)).join("")}</div>`:""}`;
    if(pct>=80) addXP(10);
    dReact(pct>=95?"celebrating":pct>=80?"proud":pct>=60?"encouraging":pct>=35?"disappointed":"reassuring");
  };
}
