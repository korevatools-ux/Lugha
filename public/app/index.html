function dStage(){ return `<div class="dstage" id="dStage" data-r="idle"><div class="ds-row">${["m","f"].map(g=>`<div class="dt dt-${g}"><img alt="" src="${DSPR[DREACT.idle[g]]}"><div class="fx"></div></div>`).join("")}</div><div class="ds-conf" aria-hidden="true"></div><p class="ds-cap" aria-live="polite">${esc(DREACT.idle.t)}</p></div>`; }
let dTimer=0;
function dReact(r,hold){ const st=document.getElementById("dStage"); if(!st||!DREACT[r]) return; const Rx=DREACT[r];
  st.dataset.r=r;
  st.querySelectorAll(".dt").forEach(el=>{ const g=el.classList.contains("dt-m")?"m":"f", sp=Rx[g], F=DFACE[sp]; el.querySelector("img").src=DSPR[sp];
    let fx=""; if(Rx.blush) fx+=F.c.map(([x,y])=>`<i class="blush" style="left:${x}%;top:${y}%"></i>`).join("");
    if(Rx.tears) fx+=F.e.map(([x,y])=>`<i class="tear" style="left:${x}%;top:${y+3}%"></i>`).join("");
    if(Rx.sweat) fx+=`<i class="sweat" style="left:${F.s[0]}%;top:${F.s[1]}%"></i>`;
    if(Rx.sym) fx+=`<b class="sym" style="left:${F.s[0]-4}%">${Rx.sym}</b>`;
    el.querySelector(".fx").innerHTML=fx; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; });
  st.querySelector(".ds-conf").innerHTML=Rx.confetti?Array.from({length:18},(_,i)=>`<i style="left:${3+i*5.5}%;--d:${(i%6)*.15}s;--c:${["#b6d65a","#f2b84b","#7cc6e8","#f08a7e","#a78bfa"][i%5]}"></i>`).join(""):"";
  st.querySelector(".ds-cap").textContent=Rx.t;
  clearTimeout(dTimer); if(!hold&&r!=="idle") dTimer=setTimeout(()=>dReact("idle"),5200); }
// a first guess from the learner's own words (any language); the tutor's tag refines it
function dGuess(t){ t=(t||"").trim(); if(!t) return "confused";
  if(/(ha){2,}|\b(he){2,}|\blol\b|lmao|😂|🤣|😆|\bjaja|\bmdr\b|kkk/i.test(t)) return "laughing";
  if(/traurig|müde|krank|schlecht|leider|einsam|\bsad\b|tired|sick|bad day|lonely|triste|fatigu|malade|cansad|enfermo|nimechoka|mgonjwa|huzuni|\bsorry\b|entschuldig|désolé|perdón|desculp|samahani/i.test(t)) return "reassuring";
  if(/\bwow\b|krass|wirklich\?|really\?|incroyable|increíble|kweli\?|😮|😲/i.test(t)) return "surprised";
  if(/\?\s*$/.test(t)) return "teaching";
  if(/super|toll|prima|great|awesome|danke|thank|merci|gracias|obrigad|asante|\bcool\b|liebe|love|gern|😊|😍|❤/i.test(t)) return "proud";
  if(/^(hallo|hi|hello|hey|guten|moin|servus|jambo|habari|bonjour|salut|hola|olá|oi)\b/i.test(t)) return "encouraging";
  return t.split(/\s+/).length>=8?"proud":"encouraging"; }
function dTag(reply){ reply=reply||""; const m=/^\s*\[\[(\w+)\]\]\s*/.exec(reply);
  if(m) return {r:DREACT[m[1]]?m[1]:null,text:reply.slice(m[0].length)};
  return {r:null,text:reply.replace(/^\s*\[\[?\w*\]?$/,"")}; }
// push-to-talk speech recognition; null when this browser can't do it here
function micStart(lang,on){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let r; try{ r=new SR(); }catch(e){ return null; } r.lang=lang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1; let fin="", err="";
  r.onresult=e=>{ let t=""; for(const x of e.results) t+=x[0].transcript; fin=t; on.text&&on.text(t); };
  r.onerror=e=>{ err=e.error||"error"; }; r.onend=()=>on.end&&on.end(fin.trim(),err);
  try{ r.start(); }catch(e){ return null; } return r; }

/* ---------- AI tutor ---------- */
let chat=[]; let ctl=null; let tutorMode="talk";
const MODES={talk:"Gespräch",write:"Text korrigieren",exam:"Prüfung üben"};
function rules(){
  const L=S.tutorLang, lv=S.level;
  const base=`You are Lugha, a patient, encouraging ${L} tutor for a learner at CEFR level ${lv}. The learner's strongest language is English.${ageAI()} Keep replies short (under 110 words), use simple ${L} at the learner's level, and add a short English hint only when something is hard.`;
  const tag=` Begin every reply with exactly one tag in double square brackets that says how two friendly detective mascots should react with their faces to the learner's LAST message: [[celebrating]] perfect and impressive, [[proud]] good effort, [[encouraging]] okay but simple, [[teaching]] you corrected a mistake or answer their question, [[laughing]] they made a joke, [[surprised]] they said something unexpected, [[discovery]] they shared something new and interesting, [[confused]] you could not understand it, [[reassuring]] they feel sad, tired or worried, [[apologetic]] you misunderstood them before, [[disappointed]] they gave up or answered in the wrong language. Example: "[[proud]] Super! …". Never mention the tag.`;
  if(tutorMode==="talk") return base+tag+` Have a friendly everyday conversation in ${L}. After each learner message, first write "✏️ " plus a corrected version of their sentence ONLY if it had mistakes (name the rule in a few words), then reply naturally and end with one question to keep talking.`;
  if(tutorMode==="write") return base+` The learner sends a text (email, forum post, essay). Reply with: 1) the corrected text, 2) a list of at most 5 key mistakes with the rule, 3) one tip to sound more natural at ${lv} level, 4) an estimated score out of 10 for an exam at ${lv}.`;
  return base+tag+` Act as a speaking examiner for a ${L} ${lv} exam (for German: Goethe-Zertifikat). Ask ONE exam question at a time about everyday topics (presentation topics, opinions, planning together). After each answer, give brief feedback (what was good, one correction) and then ask the next question.`;
}
async function tutor(){
  const sample = await getSample();
  h(`<section class="card"><span class="label">KI-Tutor</span><h1>Üben mit deinem Tutor</h1>
   <div class="row"><label for="tLang" class="label">Sprache</label><select id="tLang" style="width:auto">${langOptions(S.tutorLang)}</select>
   <label for="tLvl" class="label">Niveau</label><select id="tLvl" style="width:auto">${["A1","A2","B1","B2","C1"].map(k=>`<option ${k===S.level?"selected":""}>${k}</option>`).join("")}</select></div>
   <div class="row"><button data-go="plan">🗣 Planen-Trainer (Sprechen Teil 1)</button></div>
   <div class="seg" role="group" aria-label="Modus">${Object.entries(MODES).map(([k,v])=>`<button data-mode="${k}" aria-pressed="${k===tutorMode}">${v}</button>`).join("")}</div></section>
   <div id="tBody"></div>`);
  if(!sample){ $("#tBody").innerHTML=`<section class="card"><p>The AI tutor works when this page is open in Claude while you're signed in. Lessons, flashcards and dictation work without it.</p></section>`; return; }
  $("#tLang").onchange=e=>{ S.tutorLang=e.target.value; save(); chat=[]; paintChat(); };
  $("#tLvl").onchange=e=>{ S.level=e.target.value; save(); };
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ tutorMode=b.dataset.mode; chat=[]; document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b)); paintChat(); });
  $("#tBody").innerHTML=`<section class="card">${dStage()}<div class="chat" id="chat"></div>
    <label for="tIn" class="label" id="tLab"></label><textarea id="tIn"></textarea>
    <p class="muted" style="font-size:13px">🎤 Want to speak instead of typing? Tap the microphone on your keyboard. It only listens while you use it.</p>
    <div class="row"><button id="tMic" class="mic-btn">🎤 Sprich mit uns</button><button id="send">Senden</button><button class="ghost" id="stop" hidden>Stopp</button><button class="ghost" id="clear">Neu anfangen</button></div>
    <p class="muted" id="tErr"></p></section>`;
  paintChat();
  $("#clear").onclick=()=>{ chat=[]; paintChat(); dReact("idle"); };
  let micOn=null, viaMic=false;
  const micLabel=on=>{ const b=$("#tMic"); if(b){ b.textContent=on?"■ Fertig":"🎤 Sprich mit uns"; b.classList.toggle("on",on); } };
  $("#tMic").onclick=()=>{ if(micOn){ micOn.stop(); return; } $("#tErr").textContent="";
    micOn=micStart(LANGS[S.tutorLang]||"de-DE",{text:t=>{ $("#tIn").value=t; },end:(t,err)=>{ micOn=null; micLabel(false);
      if(t){ viaMic=true; $("#send").click(); return; }
      if(/not-allowed|service-not-allowed|audio-capture/.test(err)){ $("#tErr").textContent=MIC_NO; dReact("apologetic"); } else dReact("confused"); }});
    if(!micOn){ $("#tErr").textContent=MIC_NO; dReact("apologetic"); return; }
    micLabel(true); dReact("listening",true); };
  $("#stop").onclick=()=>ctl&&ctl.abort();
  $("#send").onclick=async()=>{ if($("#tIn")&&$("#tIn").value.trim()) quest("tutor");
    const txt=$("#tIn").value.trim();
    if(!txt && !(tutorMode==="exam" && !chat.length)) return;
    chat.push({role:"user",content: txt || "Bitte stellen Sie mir die erste Prüfungsfrage."});
    $("#tIn").value=""; paintChat(); const guess=dGuess(txt); dReact(guess,true);
    const spoke=viaMic; viaMic=false;
    const bubble=document.createElement("div"); bubble.className="msg ai"; bubble.textContent="…"; $("#chat").appendChild(bubble);
    ctl=new AbortController(); $("#send").disabled=true; $("#stop").hidden=false; $("#tErr").textContent="";
    try{
      const turns=chat.slice(-12);
      const {text}=await sample([{role:"user",content:rules()},...turns],{cache:false,signal:ctl.signal,modelTier:"quick",onText:({text})=>{bubble.textContent=dTag(text).text;}});
      const T=dTag(text); chat.push({role:"assistant",content:T.text}); addXP(5); paintChat();
      dReact(T.r||(/✏️/.test(T.text)?"teaching":guess));
      if(spoke) try{ speak(T.text.replace(/✏️[^\n]*\n?/,""),LANGS[S.tutorLang]||"de-DE"); }catch(e){}
    }catch(e){
      bubble.textContent=dTag(e.text||"").text; dReact("apologetic");
      if(e.code==="not_granted"||e.code==="sampling_disabled"){ $("#tBody").innerHTML=`<section class="card"><p>The tutor isn't available on this account. Lessons, flashcards and dictation still work.</p></section>`; return; }
      if(e.code==="rate_limited") $("#tErr").textContent="Too many messages. Please wait a few minutes.";
      else if(e.code!=="cancelled") $("#tErr").textContent="Message couldn't be sent. Please try again.";
      if(!e.text) bubble.remove(); else chat.push({role:"assistant",content:e.text});
    }finally{ const s=$("#send"); if(s){ s.disabled=false; $("#stop").hidden=true; } }
  };
}
function paintChat(){
  const box=$("#chat"); if(!box) return;
  const hints={talk:`Schreib etwas auf ${S.tutorLang} … z. B. „Hallo! Ich heiße …“`,write:"Füge deinen Text ein (E-Mail, Forumsbeitrag …)",exam:"Leer lassen und „Senden“ drücken, um die erste Frage zu bekommen"};
  $("#tLab").textContent=MODES[tutorMode]; $("#tIn").placeholder=hints[tutorMode];
  const lang=LANGS[S.tutorLang]||"de-DE";
  box.innerHTML = chat.length ? chat.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}${m.role==="assistant"?`<div style="margin-top:6px">${sayBtn(m.content.replace(/✏️[^\n]*\n?/,""),lang)}</div>`:""}</div>`).join("")
   : `<div class="note">${tutorMode==="talk"?"Chat freely. The tutor corrects your mistakes and keeps the conversation going.":tutorMode==="write"?"Paste your exam text and get corrections, tips and a score.":"The tutor asks you exam questions one by one and gives feedback on each answer."}</div>`;
  box.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,b.dataset.lang));
}

function list(root,ctx){
  clearInterval(timer);
  root.innerHTML=CSS+`<p class="mt-meta">${MAILS.filter((m,i)=>st[i]&&st[i].score!=null).length} / ${MAILS.length} E-Mails geschrieben</p>
  <div class="mt-list">${MAILS.map((m,i)=>`<button class="mt-row" data-mi="${i}"><span><b>${i+1}. ${E(m.t)}</b><small>${E(m.teil)}${st[i]&&st[i].exam!=null?` · Prüfung: ${String(st[i].exam).replace(".",",")}/${st[i].examMax} P.`:st[i]&&st[i].score!=null?` · Inhalt ${st[i].score}%`:""}</small></span><span class="mt-badge ${m.type==="formell"?"f":""}">${m.type}</span></button>`).join("")}</div>`;
  root.querySelectorAll("[data-mi]").forEach(b=>b.onclick=()=>open(root,ctx,+b.dataset.mi));
}

function open(root,ctx,i){
  clearInterval(timer);
  const m=MAILS[i]; const saved=(st[i]&&st[i].text)||"";
  const formal=m.type==="formell"; const mins=formal?15:20;
  root.innerHTML=CSS+`<div class="mt-btns"><button class="mt-btn" data-back>← Alle E-Mails</button><span class="mt-badge ${formal?"f":""}">${m.type} · ${E(m.teil)}</span></div>
  <p style="margin:6px 0">${m.prompt?"Write the email in German.":"Rewrite this email in German."} Use the right greeting and sign-off (${formal?"<b>Sehr geehrte … / Mit freundlichen Grüßen</b>, and <b>Sie</b>":"<b>Liebe/Lieber … / Viele Grüße</b>, and <b>du</b>"}). Cover every point.</p>
  ${m.prompt?`<div class="mt-mail"><div class="mt-head"><span>Aufgabe aus dem Kurs · Schreiben Teil 1</span></div><div class="mt-body">${E(m.prompt)}</div></div>`:`<div class="mt-mail"><div class="mt-head"><span>To: ${E(m.to)}</span><span>Subject: ${E(m.subj)}</span><span>Language: English → <b>Deutsch</b></span></div><div class="mt-body">${E(m.en)}</div></div>`}
  <div class="mt-btns"><button class="mt-btn" data-timer>⏱ ${mins}-Minuten-Timer</button><span class="mt-meta" data-clock></span></div>
  <label class="mt-meta" for="mt-ta">Deine E-Mail auf Deutsch · ✍️ type it, or 🎤 tap the box and dictate with your keyboard's microphone</label>
  <textarea class="mt-ta" id="mt-ta" lang="de" spellcheck="false" placeholder="${formal?"Sehr geehrte …":"Liebe …"}">${E(saved)}</textarea>
  <div class="mt-btns"><span class="mt-meta" data-wc></span></div>
  <div class="mt-btns"><button class="mt-btn p" data-chk>✓ Prüfen</button><button class="mt-btn" data-ai>🎓 Bewertung wie ÖSD/Goethe</button><button class="mt-btn" data-model>👁 Musterlösung</button><button class="mt-btn" data-next>Nächste →</button></div>
  <div data-res></div><div class="mt-out" data-ai-out></div><div data-model-out></div>`;
  const q=s=>root.querySelector(s); const ta=q("#mt-ta");
  const wc=()=>{ const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0; q("[data-wc]").textContent=`${n} Wörter · Ziel: ca. ${formal?40:80}`; st[i]=Object.assign(st[i]||{},{text:ta.value}); sv(); };
  ta.addEventListener("input",wc); wc();
  q("[data-back]").onclick=()=>list(root,ctx);
  q("[data-next]").onclick=()=>open(root,ctx,(i+1)%MAILS.length);
  q("[data-timer]").onclick=()=>{ clearInterval(timer); let left=mins*60; const tick=()=>{ q("[data-clock]")&&(q("[data-clock]").textContent=left>0?`noch ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`:"⏰ Zeit ist um!"); if(left--<=0) clearInterval(timer); }; tick(); timer=setInterval(tick,1000); };
  q("[data-chk]").onclick=()=>{ if(ta.value.trim()) quest("mail");
    const t=low(ta.value); if(!t.trim()){ q("[data-res]").innerHTML=`<p class="mt-no">Write your email first.</p>`; return; }
    const form=formal
      ? [["Anrede: Sehr geehrte/r …",/sehr geehrte/],["Gruß: Mit freundlichen Grüßen",/mit freundlichen grüßen|mit freundlichen gruessen/],["Sie-Form (Sie / Ihnen / Ihr)",/\b(sie|ihnen|ihr|ihre|ihrem|ihren)\b/]]
      : [["Anrede: Liebe/Lieber/Hallo …",/\b(liebe|lieber|hallo|hi)\b/],["Gruß: Viele/Liebe Grüße …",/grüße|gruesse|bis bald|tschüss/],["du-Form (du / dir / dich / dein)",/\b(du|dir|dich|dein|deine|deiner|deinen)\b/]];
    const items=form.map(([l,re])=>[l,re.test(t)]).concat(m.keys.map(k=>[k.split("|")[0],k.split("|").some(w=>t.includes(low(w)))]));
    const ok=items.filter(x=>x[1]).length; const pct=Math.round(ok/items.length*100);
    const n=ta.value.trim().split(/\s+/).length; const target=formal?40:80;
    st[i]=Object.assign(st[i]||{},{score:pct}); sv();
    q("[data-res]").innerHTML=`<h3 style="margin:8px 0">Inhaltspunkte: ${pct} % · Erfüllung geschätzt: <b>${pct>=90?"A":pct>=70?"B":pct>=50?"C":pct>=30?"D":"E"}</b>${n<target/2?" (zu kurz → E = 0 Punkte)":""}  ${pct>=85?"· Sehr gut! 🎉":pct>=60?"· Gut, ergänze die fehlenden Punkte":"· Schau dir die fehlenden Punkte an"}</h3>
     <div class="mt-check">${items.map(([l,y])=>`<span class="${y?"mt-ok":"mt-no"}">${y?"✓":"✗"} ${E(l)}</span>`).join("")}</div>
     <p class="mt-meta">${n} Wörter ${n<target*0.75?"· a bit short":n>target*1.5?"· a bit long":"· good length"}. This checklist only looks for the key content words. It can't judge coherence, vocabulary or grammar, so tap <b>Bewertung wie ÖSD/Goethe</b> for the full exam score.</p>`;
  };
  q("[data-model]").onclick=()=>{ const o=q("[data-model-out]"); if(o.innerHTML){ o.innerHTML=""; return; }
    o.innerHTML=`<div class="mt-mail" style="margin-top:8px"><div class="mt-head"><span>Musterlösung · ${m.type}</span></div><div class="mt-body">${E(m.de)}</div></div><div class="mt-btns" style="margin-top:8px"><button class="mt-btn" data-hear>▶ Musterlösung hören</button></div>`;
    o.querySelector("[data-hear]").onclick=()=>ctx.speak(m.de.replace(/\n+/g," ")); };
  q("[data-ai]").onclick=async()=>{
    const out=q("[data-ai-out]"); const txt=ta.value.trim(); if(!txt){ out.textContent="Write your email first."; return; }
    const words=txt.split(/\s+/).length; const need=formal?40:80; const maxC=formal?5:10;
    const PTS={A:1,B:.75,C:.5,D:.25,E:0};
    if(words<need/2){ out.innerHTML=scoreTable({erfuellung:"E",kohaerenz:"E",wortschatz:"E",strukturen:"E"},maxC,`Only ${words} words. Under half of the ${need} required words means Erfüllung E, so the task scores 0 points (official rule).`); return; }
    const sample=await ctx.getSample(); if(!sample){ out.textContent="The official scoring needs this page to be open in Claude while you're signed in. The checklist and the model answer work without it."; return; }
    q("[data-ai]").disabled=true; out.textContent="Wird bewertet wie in der Prüfung … (ca. 20–60 Sekunden)";
    try{
      const r=await sample.json(`You are a certified examiner for the Goethe-/ÖSD-Zertifikat B1, module Schreiben, ${formal?"Teil 3 (formal email, about 40 words)":"Teil 1 (personal email, about 80 words)"}. ${m.prompt?`The task (official exam prompt):\n${m.prompt}`:`The task: rewrite this English email in German, covering every point (each point = one Sprachfunktion/Inhaltspunkt).\n\nOriginal English email:\n${m.en}`}

Candidate's German email (${words} words):
${txt.slice(0,3000)}

Mark it strictly with the official B1 criteria. Give each criterion exactly one level A, B, C, D or E (no values in between):
- Erfüllung (Inhalt, Umfang, Sprachfunktionen = the points of the task): A = all points covered fully and appropriately; B = most points appropriate, one only partly; C = about half appropriate, the rest only partly; D = at most one point appropriate or partly recognisable; E = under 50% of the required words or topic missed.
- Kohärenz (Textsorte, Register ${formal?"(formal: Sehr geehrte…, Sie, Mit freundlichen Grüßen)":"(informal: Liebe/r…, du, Viele Grüße)"}, Textaufbau, Verknüpfung): A = consistently appropriate, well connected; B = largely; C = partly; D = hardly; E = not at all.
- Wortschatz (Spektrum, Beherrschung): A = wide range, isolated slips that don't hinder understanding; B = adequate range, several slips that don't hinder; C = limited, slips partly hinder; D = very limited, slips seriously hinder; E = not enough to judge.
- Strukturen (Spektrum, Morphologie, Syntax, Orthografie): same scale as Wortschatz, for grammar and spelling.

Reply with only JSON: {"erfuellung":"A-E","kohaerenz":"A-E","wortschatz":"A-E","strukturen":"A-E","gruende":{"erfuellung":"one short sentence in ${UI_NAME()}","kohaerenz":"…","wortschatz":"…","strukturen":"…"},"fehlende_punkte":["points of the task that are missing or wrong, in ${UI_NAME()}"],"fehler":[{"falsch":"wrong German phrase","richtig":"corrected","regel":"short rule in ${UI_NAME()}"}],"korrektur":"the full corrected German email"}`,{modelTier:"default"});
      const lv=x=>/^[A-E]$/.test(String(x||"").trim().toUpperCase())?String(x).trim().toUpperCase():"C";
      const g={erfuellung:lv(r.erfuellung),kohaerenz:lv(r.kohaerenz),wortschatz:lv(r.wortschatz),strukturen:lv(r.strukturen)};
      let html=scoreTable(g,maxC,"",r.gruende||{});
      const miss=(r.fehlende_punkte||[]).filter(Boolean); const err=(r.fehler||[]).filter(f=>f&&f.falsch).slice(0,8);
      if(miss.length) html+=`<h4 style="margin:12px 0 4px">Fehlende Inhaltspunkte</h4><ul style="margin:0;padding-left:20px">${miss.map(x=>`<li>${E(x)}</li>`).join("")}</ul>`;
      if(err.length) html+=`<h4 style="margin:12px 0 4px">Fehler</h4><ul style="margin:0;padding-left:20px">${err.map(f=>`<li><s class="mt-no">${E(f.falsch)}</s> → <b class="mt-ok">${E(f.richtig||"")}</b> <span class="mt-meta">${E(f.regel||"")}</span></li>`).join("")}</ul>`;
      if(r.korrektur) html+=`<div class="mt-mail" style="margin-top:10px"><div class="mt-head"><span>Korrigierte Version</span></div><div class="mt-body">${E(r.korrektur)}</div></div>`;
      out.innerHTML=html;
      const tot=Object.values(g).reduce((s,l)=>s+PTS[l]*maxC,0)*(g.erfuellung==="E"?0:1);
      st[i]=Object.assign(st[i]||{},{exam:tot,examMax:maxC*4}); sv();
    }catch(e){ out.textContent = e.code==="rate_limited"?"Too many requests. Please try again in a few minutes.":(e.code==="not_granted"||e.code==="sampling_disabled")?"The official scoring isn't available on this account.":e.code==="invalid_json"?"The scoring came back incomplete. Please tap the button again.":"That didn't work. Please try again."; }
    finally{ const b=q("[data-ai]"); if(b) b.disabled=false; }
  };
}

function scoreTable(g,maxC,note,why={}){
  const PTS={A:1,B:.75,C:.5,D:.25,E:0}; const names=[["erfuellung","Erfüllung"],["kohaerenz","Kohärenz"],["wortschatz","Wortschatz"],["strukturen","Strukturen"]];
  const ko=g.erfuellung==="E"; const pts=k=>PTS[g[k]]*maxC; const raw=names.reduce((s,[k])=>s+pts(k),0); const tot=ko?0:raw; const max=maxC*4; const pct=Math.round(tot/max*100);
  return `<h3 style="margin:10px 0 6px">Bewertung wie in der Prüfung: <b>${String(tot).replace(".",",")} / ${max} Punkte</b> (${pct} %) ${pct>=60?'<span class="mt-ok">· bestanden ✓</span>':'<span class="mt-no">· noch nicht bestanden</span>'}</h3>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:14px"><thead><tr><th style="text-align:left;border-bottom:1px solid var(--line);padding:6px">Kriterium</th><th style="border-bottom:1px solid var(--line);padding:6px">Stufe</th><th style="border-bottom:1px solid var(--line);padding:6px">Punkte</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:6px">Warum</th></tr></thead><tbody>
  ${names.map(([k,n])=>`<tr><td style="padding:6px;border-bottom:1px solid var(--line)">${n}</td><td style="padding:6px;text-align:center;border-bottom:1px solid var(--line)"><b>${g[k]}</b></td><td style="padding:6px;text-align:center;border-bottom:1px solid var(--line)">${String(pts(k)).replace(".",",")} / ${maxC}</td><td style="padding:6px;border-bottom:1px solid var(--line)" class="mt-meta">${E(why[k]||"")}</td></tr>`).join("")}
  </tbody></table></div>
  ${ko?`<p class="mt-no">Erfüllung E means the whole task scores 0 points (official rule).</p>`:""}${note?`<p class="mt-meta">${E(note)}</p>`:""}
  <p class="mt-meta">Scale per criterion: A = ${maxC}, B = ${String(maxC*.75).replace(".",",")}, C = ${String(maxC*.5).replace(".",",")}, D = ${String(maxC*.25).replace(".",",")}, E = 0. ${maxC===10?"Teil 1 has 40 points in total.":"Teil 3 has 20 points in total. The level values are scaled from the 10-point Teil 1 scale."} You pass Schreiben with 60 of 100 points across Teil 1, 2 and 3.</p>`;
}

return {render:(root,ctx)=>list(root,ctx), count:MAILS.length};
})();

  PMONTHS=["januar","februar","märz","april","mai","juni","juli","august","september","oktober","november","dezember"];

const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }

function pNorm(text){ const tips=[];

      let done=false;
      for(const d of PDAYS){ for(const cut of [d.length-1,d.length,d.length+1]){ const L=lw.slice(0,cut), R=lw.slice(cut);
        if(R.length>=3&&lev(L,d)<=1){ const pt=PPARTS.find(p=>lev(R,p)<=1||lev(R,p+"s")<=1); if(pt){ fix=d+pt; done=true; break; } } } if(done) break; }

    if(fix!==lw) tips.push(`${w} → ${shown}`); else if(isNoun&&w===lw&&fix!=="morgen") tips.push(`${w} → ${shown}`);
    return fix; });
  return {t:out.toLowerCase(), tip:[...new Set(tips)].slice(0,4).join(" · ")}; }
function pTime(t){ const day=PDAYS.find(d=>t.includes(d)); let part=null;
  if(day){ const m=new RegExp(day+"(vormittag|nachmittag|morgen|mittag|abend|nacht)").exec(t); if(m) part=m[1]; }
  if(!part){ const m=/\b(?:am |gegen )?(vormittag|nachmittag|mittag|abend|nacht)s?\b|\bmorgens\b|\bam morgen\b/.exec(t); if(m) part=m[1]||"morgen"; }

  if(day) bits.push("am "+cap(day)+(part||"")); else if(part) bits.push((/\bheute\b/.test(t)?"heute ":"am ")+cap(part));
  if(/wochenende/.test(t)) bits.push(/erste/.test(t)?"am ersten Wochenende":/nächste/.test(t)?"nächstes Wochenende":"am Wochenende");

const pList=a=>a.length<2?a[0]:a.slice(0,-1).join(", ")+" und "+a[a.length-1];
function pVal(s,t){ const parts=[]; if(s.time){ const x=pTime(t); if(x) parts.push(x); }

  return parts.length?parts.join(" "):null; }
const P_YES=/^(ja+|jo|okay|ok|gut|super|klar|gerne?|einverstanden|genau|prima|toll|perfekt|sicher|natürlich|warum nicht|klingt gut)\b|gute idee|tolle idee|das passt|passt mir|klingt gut|hört sich gut an|machen wir|bin dabei|einverstanden|das finde ich gut/;

// one partner turn: st keeps what is decided; returns the partner's reply
function pTurn(F,st,raw){ const t=raw.t; const yes=P_YES.test(t), no=P_NO.test(t), ask=/\?\s*$/.test(t);
  const S=F.steps, open=()=>S.find(s=>!(s.k in st.dec));
  const ack=(s,v)=>cap(s.ack.replace("{v}",v));
  const next=()=>{ const n=open(); if(n){ st.cur=n.k; st.miss=0; return n.q; } st.done=true; return F.close.replace(/\{(\w+)\}/g,(_,k)=>st.dec[k]||""); };
  if(st.done) return "Prima, dann haben wir alles geplant. Ich freue mich!";
  if(st.cur==="intro"){ return (no&&!yes?F.no:F.yes)+" "+next(); }
  const cur=S.find(s=>s.k===st.cur); const out=[];
  if(st.pend){ const p=st.pend; st.pend=null; const v=pVal(cur,t);
    if(v&&v!==p.val){ st.dec[cur.k]=v; out.push("Okay, du hast recht. "+ack(cur,v)); }
    else if(no&&!yes&&p.orig){ st.dec[cur.k]=p.orig; out.push("Okay, dann machen wir es so, wie du sagst. "+ack(cur,p.orig)); }
    else { st.dec[cur.k]=p.val; out.push("Super, dann machen wir das so."); } }
  else { const v=pVal(cur,t);
    if(v){ if(cur.alt&&!st.alt[cur.k]&&cur.alt.re.test(t)){ st.alt[cur.k]=1; st.pend={val:cur.alt.val,orig:v}; return cur.alt.text; }
      st.dec[cur.k]=v; out.push(ack(cur,v)); }
    else if(yes&&!no){ st.dec[cur.k]=cur.prop; out.push("Prima! "+ack(cur,cur.prop)); }
    else if(ask){ st.pend={val:cur.prop}; return `Ich würde ${cur.prop} vorschlagen. Was meinst du?`; }
    else if(no){ if(st.miss++>=1){ st.pend={val:cur.prop}; return `Hmm. Was hältst du von ${cur.prop}? Einverstanden?`; } return "Okay, was schlägst du stattdessen vor?"; }
    else { if(st.miss++>=1){ st.pend={val:cur.prop}; return `Ich schlage vor: ${cur.prop}. Einverstanden?`; } return "Entschuldigung, das habe ich nicht ganz verstanden. "+cur.q; } }
  // the learner may already have mentioned other open points
  S.forEach(s=>{ if(!(s.k in st.dec)&&s.vals&&!s.time){ const v=pVal(s,t); if(v&&!(s.alt&&s.alt.re.test(t))){ st.dec[s.k]=v; out.push(ack(s,v)); } } });
  out.push(next()); return out.join(" "); }

let tab="phrases", task=0, chat=[], step=0, useAI=false, ctl=null, st=null;
function render(root,ctx){
  root.innerHTML=CSS+`<div class="pt-wrap"><div class="pt-seg" role="group" aria-label="Planen-Trainer">${[["phrases","📋 Redemittel"],["practice","🗣 Üben mit Partner"]].map(([k,v])=>`<button data-pt="${k}" aria-pressed="${k===tab}">${v}</button>`).join("")}</div><div data-body></div></div>`;
  root.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{ tab=b.dataset.pt; render(root,ctx); });
  const body=root.querySelector("[data-body]");
  if(tab==="phrases"){
    body.innerHTML=`<p class="pt-meta">Learn 3–4 phrases from each group so they come out automatically. Tap a phrase to hear it. Disagreeing politely ⭐ is where most points are won in Teil 1.</p>`+
      CATS.map(c=>`<div class="pt-cat"><h4>${E(c.n)} <span class="pt-meta">· ${E(c.en)}</span></h4><div class="pt-ph">${c.p.map(x=>`<button data-say="${E(x.replace(/…/g,""))}">${E(x)}</button>`).join("")}</div></div>`).join("");
    body.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); ctx.speak(b.dataset.say); });
    return;
  }
  practice(body,ctx);
}
function practice(body,ctx){
  const T=TASKS[task];
  body.innerHTML=`<div class="pt-seg" role="group" aria-label="Aufgabe">${TASKS.map((x,i)=>`<button data-task="${i}" aria-pressed="${i===task}">${E(x.t)}</button>`).join("")}</div>
   <div class="pt-sit"><b>${E(T.t)}</b> <span class="pt-meta">(${E(T.src)})</span><br>${E(T.sit)}<br><span class="pt-meta">Besprechen Sie: ${T.pts.map(p=>E(p[0])).join(" · ")}</span></div>
   <label class="pt-meta" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-ai ${useAI?"checked":""}> KI-Partner: an AI partner reacts to what you say (needs Claude). Off: a scripted partner.</label>
   <div class="pt-chat" data-chat></div>
   <textarea class="pt-ta" data-in lang="de" placeholder="Deine Antwort … ✍️ type, or 🎤 tap here and dictate with your keyboard's microphone"></textarea>
   <div class="pt-seg"><button class="pt-btn p" data-send>Antworten</button><button class="pt-btn" data-end>Fertig – Auswertung</button><button class="pt-btn" data-reset>↺ Neu starten</button></div>
   <div data-out></div>`;
  const q=s=>body.querySelector(s);
  body.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{ task=+b.dataset.task; chat=[]; step=0; st=null; practice(body,ctx); });
  q("[data-ai]").onchange=e=>{ useAI=e.target.checked; chat=[]; step=0; st=null; practice(body,ctx); };
  const paint=()=>{ q("[data-chat]").innerHTML=chat.map(m=>`<div class="pt-msg ${m.r==="p"?"p":"u"}">${E(m.t)}${m.r==="p"?` <button class="pt-btn" style="min-height:28px;padding:2px 8px;font-size:12px" data-hear="${E(m.t)}">▶</button>`:""}</div>${m.tip?`<div class="pt-tip">✏️ ${E(m.tip)}</div>`:""}`).join(""); body.querySelectorAll("[data-hear]").forEach(b=>b.onclick=()=>ctx.speak(b.dataset.hear)); };
  const partnerSays=t=>{ chat.push({r:"p",t}); paint(); ctx.speak(t); };
  if(!chat.length){ partnerSays(T.lines[0]); step=1; } else paint();
  q("[data-reset]").onclick=()=>{ chat=[]; step=0; st=null; practice(body,ctx); };
  q("[data-send]").onclick=async()=>{ quest("plan");
    const v=q("[data-in]").value.trim(); if(!v) return; const N=pNorm(v); chat.push({r:"u",t:v,tip:N.tip}); q("[data-in]").value=""; paint();
    if(useAI){
      const sample=await ctx.getSample(); if(!sample){ q("[data-out]").innerHTML=`<p class="pt-meta">The AI partner needs Claude while you're signed in. Switched to the scripted partner.</p>`; useAI=false; q("[data-ai]").checked=false; }
      else{
        q("[data-send]").disabled=true; const bubble={r:"p",t:"…"}; chat.push(bubble); paint();
        try{ ctl=new AbortController();
          const hist=chat.slice(0,-1).map(m=>(m.r==="p"?"Partner: ":"Kandidat: ")+m.t).join("\n");
          const {text}=await sample(`You are the partner in a Goethe/ÖSD B1 oral exam, Sprechen Teil 1 "Gemeinsam etwas planen". Task: ${T.sit} Points to decide: ${T.pts.map(p=>p[0]).join(", ")}.\nConversation so far:\n${hist}\n\nWrite ONLY your next turn in simple B1 German (1–3 short sentences). React to what the candidate just said: sometimes agree, sometimes disagree politely and suggest an alternative, and move on to a point that is not decided yet. If all points are decided, summarise and close.`,{cache:false,modelTier:"quick",signal:ctl.signal,onText:({text})=>{bubble.t=text; paint();}});
          bubble.t=text.trim(); paint(); ctx.speak(bubble.t);
        }catch(e){ chat.pop(); paint(); q("[data-out]").innerHTML=`<p class="pt-meta">${e.code==="rate_limited"?"Too many requests. Please wait a few minutes.":"The AI partner didn't answer. Please try again, or turn it off to use the scripted partner."}</p>`; }
        finally{ q("[data-send]").disabled=false; }
        return;
      }
    }
    if(!st) st={cur:"intro",dec:{},alt:{},miss:0,pend:null,done:false};
    partnerSays(pTurn(PFLOW[task],st,N)); step++;
  };
  q("[data-end]").onclick=async()=>{
    const mine=chat.filter(m=>m.r==="u").map(m=>m.t).join(" \n "); const low=mine.toLowerCase();
    if(!mine){ q("[data-out]").innerHTML=`<p class="pt-meta">Answer your partner first.</p>`; return; }
    const cats=CATS.map(c=>[c,c.re.test(low)]); const pts=T.pts.map(p=>[p[0],p[1].test(low)]);
    const nc=cats.filter(x=>x[1]).length, np=pts.filter(x=>x[1]).length; const words=mine.split(/\s+/).length; const turns=chat.filter(m=>m.r==="u").length;
    let html=`<h3 style="margin:10px 0 6px">Auswertung: ${np}/${T.pts.length} Punkte besprochen · ${nc}/${CATS.length} Redemittel-Gruppen · ${turns} Beiträge</h3>
     <h4 style="margin:6px 0">Inhaltspunkte</h4><div class="pt-res">${pts.map(([n,y])=>`<span class="${y?"pt-ok":"pt-no"}">${y?"✓":"✗"} ${E(n)}</span>`).join("")}</div>
     <h4 style="margin:10px 0 6px">Redemittel</h4><div class="pt-res">${cats.map(([c,y])=>`<span class="${y?"pt-ok":"pt-no"}">${y?"✓":"✗"} ${E(c.n)}</span>`).join("")}</div>
     ${!cats.find(x=>x[0].k==="widersprechen")[1]?`<p class="pt-meta">⭐ Next time, disagree politely at least once, e.g. <i>„Das ist zwar ein guter Vorschlag, aber …“</i>. In the exam you need to react, not just say yes.</p>`:""}
     ${turns<5?`<p class="pt-meta">In the exam Teil 1 lasts about 3 minutes, so aim for at least 5–6 turns.</p>`:""}
     <p class="pt-meta">${words} words. This check looks for typical phrases and keywords, so it can't judge grammar or pronunciation.</p><div data-aifb></div>`;
    q("[data-out]").innerHTML=html;
    const sample=await ctx.getSample(); const fb=q("[data-aifb]");
    if(sample){ fb.innerHTML=`<button class="pt-btn" data-fb>🎓 KI-Feedback wie in der Prüfung</button><div class="pt-meta" data-fbout style="white-space:pre-wrap;margin-top:6px"></div>`;
      fb.querySelector("[data-fb]").onclick=async()=>{ const o=fb.querySelector("[data-fbout]"); o.textContent="Thinking…";
        try{ await sample(`You are a friendly Goethe/ÖSD B1 examiner. Rate the candidate's turns in Sprechen Teil 1 "Gemeinsam etwas planen". Task: ${T.sit} Points: ${T.pts.map(p=>p[0]).join(", ")}.\n\nDialogue:\n${chat.map(m=>(m.r==="p"?"Partner: ":"Kandidat: ")+m.t).join("\n")}\n\nIn simple ${UI_NAME()} with German examples, under 220 words: 1) Did the candidate make suggestions, react, agree and disagree politely, and reach decisions? 2) Up to 4 language mistakes with corrections. 3) Two better B1 phrases they could use. 4) Overall level for Teil 1: sehr gut / gut / befriedigend / ausreichend / nicht ausreichend, with one reason.`,{onText:({text})=>{o.textContent=text;}}); }
        catch(e){ o.textContent=e.code==="rate_limited"?"Too many requests. Please try again later.":(e.text||"That didn't work."); } };
    }
  };
}
return {render};
})();

function plan(){
  h(`<button class="ghost" data-go="tutor" style="align-self:flex-start">← Tutor</button>
  <section class="card"><span class="label">Sprechen Teil 1 · Goethe/ÖSD B1</span><h1>Planen-Trainer</h1><p class="muted">Learn the phrases for "Gemeinsam etwas planen", then practise with a partner. Your partner suggests, disagrees and asks. You answer by typing or with your keyboard microphone, and at the end you see what you covered.</p></section>
  <section class="card" id="ptRoot"></section>`);
  PlanTrainer.render($("#ptRoot"),{speak:t=>speak(t,"de-DE"),getSample});
}

/* ---------- ÖSD B1 Lesen Teil 4: Ja oder Nein? (signal words from the learner's vocabulary list) ---------- */
const LESEN_SIG=[["Dafür (Pro)","ok",["ich finde es sinnvoll","das ist eine gute Idee","unbedingt","auf jeden Fall","das beste","ich unterstütze das","es ist höchste Zeit","wichtig","notwendig","das hilft"]],
 ["Dagegen (Contra)","no",["schrecklich","unmöglich","gefährlich","auf keinen Fall","Ich halte nichts davon","das bringt nichts","nie wieder","übertrieben","ich bin dagegen"]],
 ["Wendepunkt – die echte Meinung kommt danach!","piv",["im Prinzip schon … aber","aber","jedoch","trotzdem","zwar … aber"]],
 ["Neutral","neu",["einerseits … andererseits","im Prinzip schon"]]];
const LESEN_Q=[
 {t:"Sollen Handys in der Schule verboten werden?",x:"Ich halte nichts davon, Handys zu verbieten. So lernen die Kinder nie, vernünftig damit umzugehen.",a:0,k:"Ich halte nichts davon",w:"\"Ich halte nichts davon\" means the person is against the ban."},
 {t:"Sollen Handys in der Schule verboten werden?",x:"Im Prinzip schon, aber ein komplettes Verbot finde ich übertrieben. In den Pausen sollten die Schüler ihr Handy benutzen dürfen.",a:0,k:"aber ein komplettes Verbot finde ich übertrieben",w:"\"Im Prinzip schon\" sounds like yes, but the real opinion comes after \"aber\": the ban is \"übertrieben\"."},
 {t:"Sollen Handys in der Schule verboten werden?",x:"Handys lenken im Unterricht ständig ab. Ich finde ein Verbot absolut sinnvoll.",a:1,k:"Ich finde ein Verbot absolut sinnvoll",w:"\"sinnvoll\" is a positive opinion word: the person is for the ban."},
 {t:"Sollen Handys in der Schule verboten werden?",x:"Einerseits sind Handys praktisch, andererseits stören sie. Trotzdem bin ich auf jeden Fall für ein Verbot.",a:1,k:"Trotzdem bin ich auf jeden Fall für ein Verbot",w:"After the neutral \"einerseits … andererseits\" comes \"trotzdem … auf jeden Fall\": a clear yes."},
 {t:"Sollte es in Städten mehr Fahrradwege geben?",x:"Es ist höchste Zeit! Mehr Fahrradwege machen die Stadt sicherer und gesünder.",a:1,k:"Es ist höchste Zeit",w:"\"Es ist höchste Zeit\" means \"it's about time\": the person is for it."},
 {t:"Sollte es in Städten mehr Fahrradwege geben?",x:"Zwar fahre ich selbst gern Rad, aber neue Wege kosten zu viel Geld. Das ist keine Lösung für den Verkehr.",a:0,k:"aber neue Wege kosten zu viel Geld. Das ist keine Lösung",w:"\"zwar … aber\": the opinion comes after \"aber\", and \"ist keine Lösung\" often means NEIN."},
 {t:"Sollte es in Städten mehr Fahrradwege geben?",x:"Viele sagen, Radwege bringen nichts. Ich sehe das anders: Sie sind die beste Lösung gegen Staus.",a:1,k:"Ich sehe das anders",w:"Trap! \"bringen nichts\" is what OTHER people say. The person disagrees with them: \"Ich sehe das anders\"."},
 {t:"Sollte es in Städten mehr Fahrradwege geben?",x:"Ich fahre nie Fahrrad. Das Geld sollte die Stadt lieber in Busse und Bahnen stecken.",a:0,k:"Das Geld sollte die Stadt lieber in Busse und Bahnen stecken",w:"The person wants the money spent on something else (\"lieber\"), so: no."},
 {t:"Sollten Schüler weniger Hausaufgaben bekommen?",x:"Hausaufgaben machen keinen Sinn, wenn die Kinder sie nur abschreiben. Weniger wäre besser.",a:1,k:"Weniger wäre besser",w:"Careful: \"macht keinen Sinn\" is about homework, and the question asks about LESS homework. \"Weniger wäre besser\" = yes."},
 {t:"Sollten Schüler weniger Hausaufgaben bekommen?",x:"Ich bin dagegen, Hausaufgaben zu reduzieren. Nur durch regelmäßiges Üben lernt man wirklich etwas.",a:0,k:"Ich bin dagegen",w:"\"Ich bin dagegen\" + reduzieren: the person is against less homework."},
 {t:"Sollten Schüler weniger Hausaufgaben bekommen?",x:"Manche Lehrer geben zu viel auf, das stimmt. Dennoch finde ich Hausaufgaben notwendig und würde nichts ändern.",a:0,k:"Dennoch finde ich Hausaufgaben notwendig und würde nichts ändern",w:"The opinion comes after the pivot word \"dennoch\": change nothing, so no."},
 {t:"Sollten Schüler weniger Hausaufgaben bekommen?",x:"Meine Tochter sitzt jeden Abend drei Stunden am Schreibtisch. Das ist viel zu stressig – auf jeden Fall weniger!",a:1,k:"auf jeden Fall weniger",w:"\"stressig\" + \"auf jeden Fall weniger\": a clear yes."},
 {t:"Sollte Fast Food an Schulen verboten werden?",x:"Gesunde Ernährung ist wichtig, deshalb unterstütze ich das Verbot.",a:1,k:"deshalb unterstütze ich das Verbot",w:"\"ich unterstütze\" = I support it: yes."},
 {t:"Sollte Fast Food an Schulen verboten werden?",x:"Ein Verbot nützt nichts. Die Jugendlichen kaufen ihre Burger dann eben nach der Schule.",a:0,k:"Ein Verbot nützt nichts",w:"\"nützt nichts\" often means NEIN."},
 {t:"Sollte Fast Food an Schulen verboten werden?",x:"Ich esse selbst manchmal Pommes, trotzdem finde ich: An Schulen hat Fast Food nichts zu suchen.",a:1,k:"trotzdem finde ich: An Schulen hat Fast Food nichts zu suchen",w:"After \"trotzdem\": fast food doesn't belong in schools, so the person is for the ban."},
 {t:"Sollte Fast Food an Schulen verboten werden?",x:"Auf keinen Fall! Die Schüler sollen selbst entscheiden, was sie essen.",a:0,k:"Auf keinen Fall",w:"\"Auf keinen Fall\" = no way."}];
let lesenSt=null;
function lesen(){
  if(!lesenSt) lesenSt={order:[...LESEN_Q.keys()].sort(()=>Math.random()-.5),i:0,ok:0,ans:null};
  const L=lesenSt, n=L.order.length;
  const decks=Object.keys(WORDS).filter(d=>d.startsWith("ÖSD Lesen:"));
  let quiz;
  if(L.i>=n){ quiz=`<h2>${L.ok}/${n} richtig</h2><p class="muted">${L.ok>=13?"Exam ready for Teil 4! 🎉":"Look at the pivot words again: the real opinion usually comes after aber, jedoch, trotzdem."}</p><button id="lsAgain">Nochmal</button>`; }
  else { const Q=LESEN_Q[L.order[L.i]];
    const shown=L.ans===null?esc(Q.x):esc(Q.x).replace(esc(Q.k),`<mark>${esc(Q.k)}</mark>`);
    quiz=`<span class="label">${L.i+1} / ${n}</span><p class="ls-q"><b>${esc(Q.t)}</b></p>
     <div class="ex"><p style="font-size:18px">${shown}</p>${sayBtn(Q.x,"de-DE","▶")}</div>
     <p class="muted">Ist die Person dafür?</p>
     <div class="row ls-ans"><button data-ls="1" ${L.ans!==null?"disabled":""}>Ja</button><button data-ls="0" ${L.ans!==null?"disabled":""}>Nein</button></div>
     ${L.ans===null?"":`<p class="note">${L.ans===Q.a?"<b>✓ Richtig!</b>":`<b>✗ Leider falsch.</b> <b>${Q.a?"Richtig ist: Ja":"Richtig ist: Nein"}</b>`} <span>${esc(Q.w)}</span></p><button id="lsNext">Weiter →</button>`}`; }
  h(`<button class="ghost" data-go="home" style="align-self:flex-start">← Zurück</button>
  <section class="card"><span class="label">ÖSD B1 · Lesen Teil 4</span><h1>Ja oder Nein?</h1>
   <p class="muted">In Teil 4 people give their opinion on a question, and you decide: is each person for it (Ja) or against it (Nein)? You don't need to understand every word, only the signal words.</p>
   <p class="note">💡 Prüfungstipp: Pay close attention to pivot words (aber, jedoch, trotzdem, im Prinzip schon). The person's true opinion almost always comes AFTER them!</p></section>
  <section class="card" id="lsQuiz">${quiz}</section>
  <section class="card"><h2>Signalwörter</h2>${LESEN_SIG.map(([h2,c,list])=>`<div class="ls-grp ls-${c}"><span class="label">${esc(h2)}</span><div class="row">${list.map(x=>sayBtn(x.replace(/…/g,""),"de-DE",x)).join("")}</div></div>`).join("")}</section>
  <section class="card"><h2>Vokabeln für Lesen Teil 4</h2><p class="muted">Every word with its meaning and an example sentence, as flashcards.</p><div class="topics">${decks.map((d,i)=>{ const x=deckStats().find(y=>y.d===d)||{d,total:WORDS[d].length,known:0,due:0}; return topicCard(x,i); }).join("")}</div></section>`);
  document.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{ const Q=LESEN_Q[L.order[L.i]]; L.ans=+b.dataset.ls; if(L.ans===Q.a){ L.ok++; addXP(2); } lesen(); setTimeout(()=>$("#lsQuiz").scrollIntoView({block:"nearest"}),0); });
  const nx=$("#lsNext"); if(nx) nx.onclick=()=>{ L.i++; L.ans=null; lesen(); setTimeout(()=>$("#lsQuiz").scrollIntoView({block:"nearest"}),0); };
  const ag=$("#lsAgain"); if(ag) ag.onclick=()=>{ lesenSt=null; lesen(); };
  document.querySelectorAll("#view [data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,b.dataset.lang||"de-DE"));
}

const TABS={home,learn,words,listen,tutor,mail,plan,lesen,accents,speak:speakPractice,voices:voiceSetup,weektest:weekTest,course:courseSetup,settings};
let curRoute="home";
function go(dest){
  curRoute=dest;
  const ci=dest.indexOf(":"), k=ci<0?dest:dest.slice(0,ci), arg=ci<0?undefined:dest.slice(ci+1);
  synth&&synth.cancel();
  if(k==="lesson") lesson(+arg);
  else if(k==="study") startStudy(arg);
  else (TABS[k]||home)();
  const tab = (k==="lesson"||k==="weektest")?"learn":k==="study"?"words":["listen","accents","speak","mail","lesen"].includes(k)?"home":["voices","course","settings"].includes(k)?"settings":k==="plan"?"tutor":k;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b){ e.preventDefault(); go(b.dataset.go); } });
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
if(!S.course&&(S.xp>0||Object.keys(S.lessons||{}).length)){ S.course={lang:"Deutsch",level:S.level||"B1"}; save(); }
setTimeout(()=>{ if(S.course&&!S.dailyOff&&S.dailyShown!==today()&&curRoute!=="course") try{ showDaily(); }catch(e){} },700);
uiStart();
paintAvatar();
paintStats();
if(canAccounts()){ if(S.account) fbInit(); else if(!S.welcomed) setTimeout(()=>welcome("start"),60); }
go(!S.course?"course":["learn","words","listen","tutor","accents","speak","mail","settings"].includes(location.hash.slice(1))?location.hash.slice(1):"home");
</script>
