name: Lugha Worker CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and package Lugha web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Run real Worker flow against the test AI provider
        run: node --test test/e2e.test.mjs

      - name: Upload Lugha web and Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: Lugha-Web-Worker
          path: |
            public/
            worker/
            test/
            firestore.rules
            README.md
            wrangler.jsonc
          if-no-files-found: warn
          retention-days: 14
